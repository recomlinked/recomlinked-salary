// ── Context panel ──
let ctxPanelOpen = false;

// Render a context question's predefined options as user-side chips, with
// a "+ Something else…" free-text escape. Saves the picked value into
// SIM_STATE.context[key] and follows up with a brief coach acknowledgment.
// Pattern matches Path A's exchange chips so context questions feel like
// the same kind of step.
//
// We save the previous pendingSubmitHandler before overriding it, so that
// after answering a context question the user returns to whatever flow
// they were in (e.g. simulation chips with "type your own scenario"
// armed) — without this, typing into the input post-context could get
// silently dropped.
function askContextQuestion(q) {
  const priorHandler = pendingSubmitHandler;
  const priorPlaceholder = $('chat-input')?.placeholder || '';

  const finish = async (savedValue, kind) => {
    SIM_STATE.context[q.key] = savedValue;
    updateContextBadge();
    logSession('context_added', { key: q.key, kind, value: savedValue });
    await sleep(200);
    await typeCoachBubble("Got it \u2014 I'll factor that into the scenarios.");
    if (priorHandler) {
      enableInput(priorPlaceholder || 'Type your answer\u2026');
      awaitFreeText(priorHandler);
    }
  };

  // Free-text-only questions (like role): no chips, just input.
  // Matches Path A's "describe it naturally" pattern.
  if (q.freeTextOnly) {
    enableInput('Describe your role\u2026');
    $('chat-input')?.focus();
    awaitFreeText(async (text) => {
      if (!text || text.trim().length < 2) return;
      appendUserBubble(text);
      await finish(text, 'freetext');
    });
    return;
  }

  const chips = (q.options || []).map(o => ({ value: o.value, label: o.label }));
  chips.push({ value: '__free__', label: '+ Something else\u2026', isFreeText: true });

  enableInput('Type your answer or tap a chip\u2026');
  awaitFreeText(async (text) => {
    if (!text || text.trim().length < 2) return;
    appendUserBubble(text);
    fadeOutChips();
    await finish(text, 'freetext');
  });

  renderUserChips(chips, async (c, _btn) => {
    fadeOutChips();

    if (c.isFreeText) {
      enableInput('Type your answer\u2026');
      awaitFreeText(async (text) => {
        if (!text || text.trim().length < 2) return;
        appendUserBubble(text);
        await finish(text, 'freetext');
      });
    } else {
      appendUserBubble(c.label);
      await finish(c.label, 'chip');
    }
  });
}

function toggleContextPanel() {
  const area = $('chips-area');
  if (!area) return;
  const btn = $('ctx-btn');
  
  if (ctxPanelOpen) {
    area.innerHTML = '';
    ctxPanelOpen = false;
    if (btn) btn.classList.remove('active');
    return;

  // Close tree panel if open
  if (treePanelOpen) toggleTreePanel();
  
  ctxPanelOpen = true;
  if (btn) btn.classList.add('active');
  
  const panel = document.createElement('div');
  panel.className = 'ctx-panel';
  panel.innerHTML = '<div class="ctx-panel-title">Add context for better scenarios (tap any):</div>';
  
  const unanswered = CONTEXT_QUESTIONS.filter(q => !SIM_STATE.context[q.key]);
  const showing = unanswered.slice(0, 3);
  
  showing.forEach(q => {
    const chip = document.createElement('span');
    chip.className = 'ctx-chip';
    chip.textContent = q.q;
    chip.onclick = () => {
      ctxPanelOpen = false;
      area.innerHTML = '';

      typeCoachBubble(q.q).then(() => {

    panel.appendChild(chip);

  if (unanswered.length === 0) {
    panel.innerHTML = '<div class="ctx-panel-title">All context provided — scenarios are fully personalized.</div>';

  area.innerHTML = '';
  area.appendChild(panel);
}

// ── Export tree as copyable text ──
function exportTreeSummary(btn) {
  const blocker = SIM_STATE.blocker?.label || 'Negotiation scenario';
  const lines = [];
  lines.push('SALARY NEGOTIATION \u2014 SCENARIO PLAN');
  lines.push('===================================');
  lines.push('');
  lines.push('Situation: ' + blocker);
  if (SIM_STATE.context.role) lines.push('Role: ' + SIM_STATE.context.role);
  if (SIM_STATE.context.timing) lines.push('Timeline: ' + SIM_STATE.context.timing);
  lines.push('');
  lines.push('SCENARIOS PRACTICED:');

  if (SIM_STATE.branch_history.length > 0) {
    SIM_STATE.branch_history.forEach((b, i) => {
      lines.push('');
      lines.push(`${i + 1}. Manager says: "${b.scenario}"`);
      lines.push(`   Your response: ${b.reply}`);
    });
  } else {
    lines.push('  (none yet)');
  }

  const unexplored = SIM_STATE.scenarios_total - SIM_STATE.scenarios_explored.length;
  if (unexplored > 0) {
    lines.push('');
    lines.push(`\u26a0 ${unexplored} scenario${unexplored > 1 ? 's' : ''} not yet practiced`);
  }

  lines.push('');
  lines.push('---');
  lines.push('Prepared with salary.recomlinked.com');

  const text = lines.join('\n');
  
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.style.color = 'var(--teal)';
    btn.style.borderColor = 'var(--teal)';
    setTimeout(() => { btn.textContent = 'Copy my preparation summary'; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-100px;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy my preparation summary'; }, 2000);
  });

  logSession('tree_exported', { paths: SIM_STATE.branch_history.length });
}

// ── Mode toggle (segmented) ──
// `setMode('sim'|'coach')` is called from the toolbar pill clicks. It
// updates the visual selected state, inserts a mode banner in the chat
// stream so the user clearly sees they switched, and triggers the
// appropriate flow (simulation pills stay tappable / coach-reflection runs).
// ── Dual Mode: Practice + Coaching ──────────────────────
// Practice and coaching are separate chat containers.
// Switching modes shows/hides the containers.
// Coaching messages accumulate in the background.
let coachingMessages = [];   // array of coaching insights
let unseenCoachCount = 0;    // how many coaching messages user hasn't seen
let currentCoachPreview = null; // the preview card in practice mode

function setMode(target) {
  if (target !== 'sim' && target !== 'coach' && target !== 'discovery' && target !== 'case') return;
  try { localStorage.setItem('rl_chat_mode', target); } catch(e) {}

  SIM_STATE.simMode = (target === 'sim');
  SIM_STATE.currentMode = target;
  updateModeToggleUI();

  const practiceEl = $('messages');
  const coachingEl = $('coaching-messages');
  const discoveryEl = $('discovery-messages');
  const caseEl = $('case-messages');

  // Hide all and remove active class
  practiceEl.style.display = 'none';
  practiceEl.classList.remove('active-chat');
  coachingEl.style.display = 'none';
  coachingEl.classList.remove('active-chat');
  if (discoveryEl) { discoveryEl.style.display = 'none'; discoveryEl.classList.remove('active-chat'); }
  if (caseEl) { caseEl.style.display = 'none'; caseEl.classList.remove('active-chat'); }

  if (target === 'discovery') {
    if (discoveryEl) {
      discoveryEl.style.display = 'block';
      discoveryEl.classList.add('active-chat');
      if (!discoveryEl.dataset.initialized) {
        initDiscoveryMode(discoveryEl);
        discoveryEl.dataset.initialized = 'true';
      }
    }
    const input = $('chat-input');
    if (input) { input.placeholder = 'Building your plan\u2026'; input.disabled = true; }
    var inputBar = document.querySelector('.input-row');
    if (inputBar) inputBar.style.display = 'none';
    var sendBtn = $('send-btn');
    if (sendBtn) sendBtn.disabled = true;
    // Hide chips area in Assess mode
    var chipsArea = $('chips-area');
    if (chipsArea) chipsArea.style.display = 'none';
    // Scroll to top so Assess content is visible
    var chatWrap = $('chat-wrap');
    if (chatWrap) setTimeout(function() { chatWrap.scrollTop = 0; }, 50);
  } else if (target === 'sim') {
    practiceEl.style.display = '';
    practiceEl.classList.add('active-chat');
    var chipsArea2 = $('chips-area');
    if (chipsArea2) chipsArea2.style.display = '';

    // If not paid and no simulation content yet, show locked preview
    if (!state.paid && !practiceEl.querySelector('.user-msg') && !practiceEl.dataset.lockedShown) {
      showLockedPractice(practiceEl);
      practiceEl.dataset.lockedShown = 'true';
      // Scroll to top of sim content so user sees bridge text first, not the paywall
      var chatWrap = $('chat-wrap');
      if (chatWrap) { chatWrap.scrollTop = practiceEl.offsetTop - 16; }
    } else {
      scrollChatToBottom();
    }

    const input = $('chat-input');
    if (input) { input.placeholder = state.paid ? 'Tap an opening or type your own\u2026' : 'Unlock full access to practice\u2026'; input.disabled = !state.paid; }
    var inputBar2 = document.querySelector('.input-row');
    if (inputBar2) inputBar2.style.display = '';
  } else if (target === 'coach') {
    coachingEl.style.display = 'block';
    coachingEl.classList.add('active-chat');
    var inputBar3 = document.querySelector('.input-row');
    if (inputBar3) inputBar3.style.display = '';

    // If not paid, show locked coaching preview
    if (!state.paid && !coachingEl.querySelector('.user-msg') && !coachingEl.dataset.lockedShown) {
      showLockedCoaching(coachingEl);
      coachingEl.dataset.lockedShown = 'true';
    }

    const input = $('chat-input');
    if (input) {
      input.placeholder = state.paid ? 'Ask your coach anything\u2026' : 'Unlock full access to chat\u2026';
      input.disabled = !state.paid;
    }
    const sendBtn = $('send-btn');
    if (sendBtn) sendBtn.disabled = !state.paid;
    if (state.paid) {
      renderCoachingUnseenHeader();
      if (unseenCoachCount > 0) {
        const allMsgs = coachingEl.querySelectorAll('.coach-msg, .user-msg');
        const firstUnseen = allMsgs.length - unseenCoachCount;
        if (firstUnseen >= 0 && allMsgs[firstUnseen]) {
          const scrollParent = $('chat-wrap');
          if (scrollParent) {
            scrollParent.scrollTop = allMsgs[firstUnseen].offsetTop - 80;
          }
        }
      } else {
        scrollCoachingToBottom();
      }
      checkCoachingScrollSeen();
      addBackToPracticeCTA();
    } else {
      var chatWrap2 = $('chat-wrap');
      if (chatWrap2) chatWrap2.scrollTop = 0;
    }
  } else if (target === 'case') {
    if (caseEl) {
      caseEl.style.display = 'block';
      caseEl.classList.add('active-chat');
      if (!caseEl.dataset.initialized) {
        initCaseMode(caseEl);
        caseEl.dataset.initialized = 'true';
      }
    }
    stopThinkingAnimation();
    const input = $('chat-input');
    if (input) { input.placeholder = 'Building your raise case\u2026'; input.disabled = true; }
    var inputBar4 = document.querySelector('.input-row');
    if (inputBar4) inputBar4.style.display = 'none';
    var sendBtn3 = $('send-btn');
    if (sendBtn3) sendBtn3.disabled = true;
    var chipsArea3 = $('chips-area');
    if (chipsArea3) chipsArea3.style.display = 'none';
    var chatWrap3 = $('chat-wrap');
    if (chatWrap3) setTimeout(function() { chatWrap3.scrollTop = 0; }, 50);
  }
}

function checkCoachingScrollSeen() {
  const scrollParent = $('chat-wrap');
  if (!scrollParent) return;
  // If scrolled to bottom (or content fits without scrolling), mark all as seen
  const atBottom = scrollParent.scrollHeight - scrollParent.scrollTop - scrollParent.clientHeight < 50;
  if (atBottom) {
    unseenCoachCount = 0;
    updateCoachBadge();
  }
}

// Listen for scroll to mark coaching messages as seen
setTimeout(function() {
  const chatWrap = $('chat-wrap');
  if (chatWrap) {
    chatWrap.addEventListener('scroll', function() {
      if (!SIM_STATE.simMode) {
        checkCoachingScrollSeen();
      }
    });
  }
}, 500);

function scrollCoachingToBottom() {
  const coachEl = $('coaching-messages');
  if (coachEl) {
    const scrollParent = coachEl.closest('.chat-scroll') || coachEl.parentElement;
    if (scrollParent) scrollParent.scrollTop = scrollParent.scrollHeight;
  }
}

// Sync the toggle UI with SIM_STATE.simMode
function updateModeToggleUI() {
  const simBtn   = $('mode-btn-sim');
  const coachBtn = $('mode-btn-coach');
  const discBtn  = $('mode-btn-disc');
  const rcaseBtn = $('mode-btn-rcase');
  if (!simBtn || !coachBtn) return;
  
  // Reset all
  [simBtn, coachBtn, discBtn, rcaseBtn].forEach(function(b) {
    if (b) { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); }
  });
  document.body.classList.remove('sim-mode');

  var mode = SIM_STATE.currentMode || 'discovery';
  if (mode === 'sim') {
    simBtn.classList.add('active');
    simBtn.setAttribute('aria-selected', 'true');
    document.body.classList.add('sim-mode');
  } else if (mode === 'coach') {
    coachBtn.classList.add('active');
    coachBtn.setAttribute('aria-selected', 'true');
  } else if (mode === 'case' && rcaseBtn) {
    rcaseBtn.classList.add('active');
    rcaseBtn.setAttribute('aria-selected', 'true');
  } else if (mode === 'discovery' && discBtn) {
    discBtn.classList.add('active');
    discBtn.setAttribute('aria-selected', 'true');
  }
}

// Update coaching tab badge with unseen count number
function updateCoachBadge() {
  const coachBtn = $('mode-btn-coach');
  if (!coachBtn) return;
  coachBtn.style.position = 'relative';
  let badge = coachBtn.querySelector('.coach-unread-count');
  if (unseenCoachCount > 0 && SIM_STATE.simMode) {
    if (!badge) {
      badge = el('span', 'coach-unread-count', '');
      coachBtn.appendChild(badge);
    }
    badge.textContent = unseenCoachCount;
    badge.style.display = '';
  } else {
    if (badge) badge.style.display = 'none';
  }
}

// Add coaching insight to coaching container (called after each practice action)
function addCoachingInsight(text, type, directionLabel) {
  type = type || 'insight';
  const coachingEl = $('coaching-messages');
  if (!coachingEl) return;

  const wrap = el('div', 'coach-msg', '');

  // Build path breadcrumb showing user choices and manager responses
  let pathHtml = '';
  if (SIM_STATE.branch_history && SIM_STATE.branch_history.length > 0) {
    const chips = [];
    for (const b of SIM_STATE.branch_history) {
      // User's choice (opening theme or reply theme)
      const userLabel = (b.reply || '').replace(/^["'\u201c\u201d]+|["'\u201c\u201d]+$/g, '');
      if (userLabel) {
        chips.push({ label: userLabel, type: 'user' });
      }
      // Manager's scenario response
      const mgrLabel = (b.scenario || '').replace(/^["'\u201c\u201d]+|["'\u201c\u201d]+$/g, '');
      if (mgrLabel && mgrLabel !== 'opening') {
        chips.push({ label: mgrLabel, type: 'manager' });
      }
    }
    if (chips.length > 0) {
      const stepsHtml = chips.map(c => {
        const short = c.label.length > 22 ? c.label.slice(0, 20) + '...' : c.label;
        const cls = c.type === 'user' ? 'path-step path-user' : 'path-step path-mgr';
        return `<span class="${cls}">${escapeHtml(short)}</span>`;
      });
      pathHtml = `<div class="coaching-path">${stepsHtml.join('<span class="path-arrow">\u2192</span>')}</div>`;
    }
  }

  // Render as a structured card
  const card = el('div', 'coaching-analysis-card', '');
  let html = '';
  if (directionLabel) {
    html += `<div class="analysis-direction">${escapeHtml(directionLabel)}</div>`;
  }
  if (pathHtml) {
    html += pathHtml;
  }
  // Format the analysis text — add line breaks before each **Label:**
  let formattedText = escapeHtml(text);
  // Split at bold labels (Approach:, Risk:, etc.) and add paragraph breaks
  formattedText = formattedText.replace(/\*\*(Approach|Risk|Opportunity|Next move|Next Move|Signal|Hidden meaning|Hidden Meaning|Preparation|Watch for|Watch For|Strategy|Strength|Weakness|After this|After This):\*\*/g, '<br><br>**$1:**');
  // Remove leading <br> if text starts with a label
  formattedText = formattedText.replace(/^<br><br>/, '');
  formattedText = inlineBold(formattedText);

  html += `<div class="analysis-body">${formattedText}</div>`;
  card.innerHTML = html;
  wrap.appendChild(card);
  coachingEl.appendChild(wrap);

  coachingMessages.push({ text, type, time: Date.now() });

  if (SIM_STATE.simMode) {
    unseenCoachCount++;
    updateCoachBadge();
  } else {
    scrollCoachingToBottom();
  }
}

// Add video to coaching container
function addCoachingVideo(blockerCode) {
  const url = COACH_VIDEO_URLS[blockerCode];
  if (!url) return;
  const coachingEl = $('coaching-messages');
  if (!coachingEl) return;

  const wrap = el('div', 'coach-msg', '');
  const thumb = el('div', 'coach-video-thumb', '');

  const avatar = el('div', 'coach-video-avatar', '');
  const img = document.createElement('img');
  img.src = COACH_THUMBS[blockerCode] || COACH_THUMBS.no_script;
  img.alt = 'Coach';
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
  avatar.appendChild(img);

  const playBadge = el('div', 'coach-video-play', '');
  playBadge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>';
  avatar.appendChild(playBadge);
  thumb.appendChild(avatar);

  const info = el('div', 'coach-video-info', '');
  const title = el('div', 'coach-video-title', '\u25B6 Coach tip');
  const desc = el('div', 'coach-video-desc', 'Your coach has a tip for you');
  info.appendChild(title);
  info.appendChild(desc);
  thumb.appendChild(info);

  const dur = el('div', 'coach-video-dur', '');
  const secs = COACH_VIDEO_DURATIONS[blockerCode] || 16;
  dur.textContent = '0:' + (secs < 10 ? '0' : '') + secs;
  thumb.appendChild(dur);

  thumb.addEventListener('click', function() {
    const overlay = el('div', 'coach-video-overlay', '');
    const fullVid = document.createElement('video');
    fullVid.src = url;
    fullVid.autoplay = true;
    fullVid.playsInline = true;
    fullVid.setAttribute('playsinline', '');
    fullVid.controls = true;
    fullVid.style.cssText = 'max-width:100%;max-height:100%;';
    overlay.appendChild(fullVid);
    const closeBtn = el('button', 'coach-video-close', '\u00d7');
    closeBtn.addEventListener('click', function(e) { e.stopPropagation(); fullVid.pause(); overlay.remove(); });
    overlay.appendChild(closeBtn);
    fullVid.addEventListener('ended', function() { overlay.remove(); });
    overlay.addEventListener('click', function(e) { if (e.target === overlay) { fullVid.pause(); overlay.remove(); } });
    document.body.appendChild(overlay);
    try { localStorage.setItem('rl_video_watched', blockerCode); } catch(e) {}
    logEntry('video_watched', { blocker: blockerCode });
  });

  wrap.appendChild(thumb);
  coachingEl.appendChild(wrap);

  coachingMessages.push({ text: 'Video tip: ' + blockerCode, type: 'video', time: Date.now() });
  if (SIM_STATE.simMode) {
    unseenCoachCount++;
    updateCoachBadge();
  }
}

// Show a preview card in practice mode (one at a time, replaces previous)
// The card shows a MENU of what's available in coaching mode, not the full content
function showCoachPreviewCard(action, context) {
  // Collapse previous tip card
  if (currentCoachPreview) {
    currentCoachPreview.classList.add('collapsing');
    const old = currentCoachPreview;
    setTimeout(() => old.remove(), 300);
  }

  // Static gist messages per action — no API wait
  const gistTexts = {
    opening_picked: 'Your coach analyzed this opening strategy.',
    scenario_selected: 'Your coach decoded this manager response.',
    reply_chosen: 'Your coach evaluated your reply strategy.',
  };
  const gistText = gistTexts[action] || 'Your coach has tips for this move.';

  // Single CTA text per action
  const ctaTexts = {
    opening_picked: 'See risk, opportunity & full breakdown \u2192',
    scenario_selected: 'See hidden meaning & full breakdown \u2192',
    reply_chosen: 'See strength, weakness & full breakdown \u2192',
  };
  const ctaText = ctaTexts[action] || 'See full coach tips \u2192';

  const preview = el('div', 'tip-card', '');
  preview.id = 'active-tip-card';
  preview.innerHTML = `
    <div class="tip-card-header">
      <span class="tip-card-icon"><svg viewBox="0 0 20 20" fill="none" width="16" height="16"><path d="M3.5 5.5c0-1.1 0.9-2 2-2h9c1.1 0 2 0.9 2 2v6c0 1.1-0.9 2-2 2H8.5l-3 3v-3h-0.5c-1.1 0-2-0.9-2-2v-6z" stroke="#8a7540" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7.5" cy="8.5" r="0.8" fill="#8a7540"/><circle cx="10.5" cy="8.5" r="0.8" fill="#8a7540"/><circle cx="13.5" cy="8.5" r="0.8" fill="#8a7540"/></svg></span>
      <span class="tip-card-label">Coach tip</span>
    </div>
    <div class="tip-card-gist">${gistText}</div>
    <a class="tip-card-link" href="javascript:void(0)">${ctaText}</a>
  `;
  preview.querySelector('.tip-card-link').addEventListener('click', function(e) {
    e.stopPropagation();
    setMode('coach');
  });

  $('messages').appendChild(preview);
  currentCoachPreview = preview;
  scrollChatToBottom();
}

function populateTipCard(gist) {
  const card = document.getElementById('active-tip-card');
  if (!card) return;
  const gistEl = card.querySelector('.tip-card-gist');
  if (gistEl && gist) {
    let html = escapeHtml(gist);
    html = html.replace(/^(Strong)\s*[—\-]/, '<span class="verdict-strong">$1</span> —');
    html = html.replace(/^(Risky)\s*[—\-]/, '<span class="verdict-risky">$1</span> —');
    html = html.replace(/^(Safe)\s*[—\-]/, '<span class="verdict-safe">$1</span> —');
    html = html.replace(/^(Bold)\s*[—\-]/, '<span class="verdict-bold">$1</span> —');
    gistEl.innerHTML = html;
  }
}


// Render "X unseen messages" header in coaching mode
function renderCoachingUnseenHeader() {
  const coachingEl = $('coaching-messages');
  if (!coachingEl) return;
  coachingEl.querySelectorAll('.coaching-unseen').forEach(e => e.remove());
}

// Add "Back to practice" CTA at bottom of coaching
function addBackToPracticeCTA() {
  const coachingEl = $('coaching-messages');
  if (!coachingEl) return;
  coachingEl.querySelectorAll('.back-to-practice').forEach(e => e.remove());
  const cta = el('div', 'back-to-practice', '');
  cta.innerHTML = '\u2190 Continue practicing';
  cta.addEventListener('click', function() { setMode('sim'); });
  coachingEl.appendChild(cta);
}

var LS_CASE_STATE = 'rl_case_state';

var caseState = {
  template: null,
  currentQ: 0,
  answers: {},
  polished: {},
  reviewing: false,
  paid: false
};

function saveCaseState() {
  try {
    caseState.sessionId = state.sim_session_id || caseState.sessionId || '';
    localStorage.setItem(LS_CASE_STATE, JSON.stringify(caseState));
  } catch(e) {}
}

function loadCaseState() {
  try {
    var saved = localStorage.getItem(LS_CASE_STATE);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && parsed.template) {
        caseState = parsed;
        if (parsed.sessionId) state.sim_session_id = parsed.sessionId;
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function clearCaseState() {
  caseState = { template: null, currentQ: 0, answers: {}, polished: {}, reviewing: false, paid: !!state.paid };
  try { localStorage.removeItem(LS_CASE_STATE); } catch(e) {}
}

function initCaseMode(container) {
  var params = new URLSearchParams(location.search);
  var tmpl = params.get('template') || '';
  if (!tmpl) { try { tmpl = localStorage.getItem('rl_case_template') || ''; } catch(e) {} }
  if (!tmpl) tmpl = 'performance';
  if (!CASE_TEMPLATES[tmpl]) tmpl = 'performance';

  var restored = loadCaseState();
  if (restored && caseState.template === tmpl && caseState.currentQ > 0) {
    // Fix: if polished sections exist beyond currentQ, advance it
    var t2 = CASE_TEMPLATES[tmpl];
    if (t2) {
      var maxPolished = -1;
      t2.questions.forEach(function(q, i) { if (caseState.polished[q.section] && i >= caseState.currentQ) maxPolished = i; });
      if (maxPolished >= 0) caseState.currentQ = maxPolished + 1;
      saveCaseState();
    }
    restoreCaseUI(container, tmpl);
    return;
  }

  caseState.template = tmpl;
  state.sim_session_id = 'case_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  logSession('case_template_selected', { template: tmpl });
  caseState.currentQ = 0;
  caseState.answers = {};
  caseState.polished = {};
  caseState.reviewing = false;
  caseState.paid = !!state.paid; // sync with global paid status
  saveCaseState();

  container.innerHTML = '';
  var t = CASE_TEMPLATES[tmpl];

  var docPreview = el('div', 'case-doc-preview', '');
  docPreview.id = 'case-doc-preview';
  var accent = t.accent || '#3a6ea5';
  docPreview.style.setProperty('--case-accent', accent);
  var topbar = '<div class="case-doc-topbar" style="background:' + accent + ';"><div><div class="case-doc-topbar-title">Compensation review request</div><div class="case-doc-topbar-name" id="case-doc-name" contenteditable="true" spellcheck="false" data-ph="Your name" onfocus="caseNameFocus(this)" onblur="caseNameBlur(this)" oninput="caseNameInput(this)"></div><div class="case-doc-topbar-role" id="case-doc-role">Your Role</div></div></div>';
  var docHeader = '<div class="case-doc-body"><div class="case-doc-header">Compensation Review Request</div>';
  docHeader += '<div class="case-doc-sub">Your raise case document builds here as you answer</div>';
  var sections = '';
  t.sections.forEach(function(name, i) {
    sections += '<div class="case-doc-section empty" id="case-sec-' + i + '">' +
      '<div class="case-doc-section-label">' + escapeHtml(name) + '</div>' +
      '<div class="case-doc-section-text">' + renderWaitingSection(i) + '</div>' +
      '</div>';
  });
  var footer = '</div><div class="case-doc-footer"><span>Prepared with salary.recomlinked.com</span><span>Confidential</span></div>' +
    '<div class="case-doc-download"><span class="case-doc-download-name"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + escapeHtml(t.name) + '.pdf</span><button class="case-doc-download-btn" data-locked="true" onclick="if(this.dataset.locked){alert(\"Complete all sections first to download your PDF.\")}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download PDF</button></div>';
  docPreview.innerHTML = topbar + docHeader + sections + footer;
  var deliverables = el('div', '', '');
  deliverables.id = 'case-deliverables';
  var docLabelHtml = '<div class="case-deliverables-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Your raise case document</div>';
  deliverables.innerHTML = docLabelHtml;
  deliverables.appendChild(docPreview);
  container.appendChild(deliverables);
  buildEmailDraft(deliverables, t.name, accent);
  populateCaseName();

  // If already paid — go straight to Q1
  if (caseState.paid) {
    showCaseQuestion(container, 0);
    return;
  }

  // Not paid — show skeleton + instant paywall like coaching/practice
  state.paywall_shown = true;
  saveState();
  appendStandardPaywall(container, { mode: 'case' });
}


function restoreCaseUI(container, tmpl) {
  container.innerHTML = '';
  var t = CASE_TEMPLATES[tmpl];
  var pw = t.paywallAfter || 2;
  logSession('case_resumed', { template: tmpl });

  var welcome = el('div', 'case-q-bubble', '');
  welcome.innerHTML = '<div class="case-q-text">Welcome back. Your progress has been saved. Continuing where you left off.</div>' +
    '<div style="margin-top:8px;"><a href="#" style="font-size:12px;color:var(--t3);" onclick="clearCaseState();window.location.href=\'/raise/chat/?mode=case&template=' + tmpl + '\';return false;">Start over</a></div>';
  container.appendChild(welcome);

  var docPreview = el('div', 'case-doc-preview', '');
  docPreview.id = 'case-doc-preview';
  var accent = t.accent || '#3a6ea5';
  docPreview.style.setProperty('--case-accent', accent);
  var topbar = '<div class="case-doc-topbar" style="background:' + accent + ';"><div><div class="case-doc-topbar-title">Compensation review request</div><div class="case-doc-topbar-name" id="case-doc-name" contenteditable="true" spellcheck="false" data-ph="Your name" onfocus="caseNameFocus(this)" onblur="caseNameBlur(this)" oninput="caseNameInput(this)"></div><div class="case-doc-topbar-role" id="case-doc-role">Your Role</div></div></div>';
  var docHeader = '<div class="case-doc-body"><div class="case-doc-header">Compensation Review Request</div>';
  docHeader += '<div class="case-doc-sub">Your raise case document builds here as you answer</div>';
  var sections = '';
  t.sections.forEach(function(name, i) {
    var hasPolished = caseState.polished[i];
    var cssClass = hasPolished ? 'case-doc-section' : 'case-doc-section empty';
    sections += '<div class="' + cssClass + '" id="case-sec-' + i + '">' +
      '<div class="case-doc-section-label">' + escapeHtml(name) + '</div>' +
      '<div class="case-doc-section-text">' + (hasPolished ? renderCaseSection(hasPolished, i) : renderWaitingSection(i)) + '</div>' +
      '</div>';
  });
  var footer = '</div><div class="case-doc-footer"><span>Prepared with salary.recomlinked.com</span><span>Confidential</span></div>' +
    '<div class="case-doc-download"><span class="case-doc-download-name"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + escapeHtml(t.name) + '.pdf</span><button class="case-doc-download-btn" data-locked="true" onclick="if(this.dataset.locked){alert(\"Complete all sections first to download your PDF.\")}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download PDF</button></div>';
  docPreview.innerHTML = topbar + docHeader + sections + footer;
  var deliverables = el('div', '', '');
  deliverables.id = 'case-deliverables';
  var docLabelHtml = '<div class="case-deliverables-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Your raise case document</div>';
  deliverables.innerHTML = docLabelHtml;
  deliverables.appendChild(docPreview);
  container.appendChild(deliverables);
  buildEmailDraft(deliverables, t.name, accent);
  populateCaseName();

  // Fill header with saved Q1 data
  if (t.questions[0] && t.questions[0].type === 'row' && caseState.answers[t.questions[0].id]) {
    try {
      var q1 = JSON.parse(caseState.answers[t.questions[0].id]);
      var nameEl = document.getElementById('case-doc-name');
      var roleEl = document.getElementById('case-doc-role');
      var title = q1.role || q1.current_title || q1.new_title || '';
      var context = '';
      if ((q1.tenure || q1.company_tenure) && (q1.role || !q1.current_title)) {
        var dur = formatDuration(q1.tenure);
        if (tmpl === 'offer') context = dur + ' at the company';
        else if (tmpl === 'market') context = dur + ' in this role';
        else context = dur + ' since last raise';
      }
      else if (q1.hired_as) context = 'Originally hired as ' + q1.hired_as;
      else if (q1.duration) context = formatDuration(q1.duration) + ' doing the extra work';
      else if (q1.location) context = q1.location;
      else if (q1.old_title) context = 'Previously ' + q1.old_title;
      if (nameEl && title) nameEl.textContent = title;
      if (roleEl) roleEl.textContent = context;
    } catch(e) {}
  }

  for (var i = 0; i < caseState.currentQ && i < t.questions.length; i++) {
    var q = t.questions[i];
    var ans = caseState.answers[q.id] || '';
    if (!ans) continue;
    var conf = el('div', 'case-q-bubble', '');
    conf.style.cssText = 'background:rgba(123,92,252,0.08);border-color:rgba(123,92,252,0.2);';
    var displayAns = ans;
    if (q.type === 'row') {
      try { var p = JSON.parse(ans); displayAns = Object.values(p).filter(function(v){return v;}).join(' \u2022 '); } catch(e) {}
    }
    conf.innerHTML = '<div class="case-q-label" style="color:var(--t3);">' + escapeHtml(q.label) + '</div>' +
      '<div class="case-q-text" style="color:var(--t1);font-size:13px;">\u2713 ' + escapeHtml(displayAns).substring(0, 200) + '</div>';
    container.insertBefore(conf, $('case-deliverables'));
  }

  if (caseState.currentQ >= t.questions.length) {
    buildCaseReview(container);
  } else {
    showCaseQuestion(container, caseState.currentQ);
  }
}

function showCaseQuestion(container, qIndex) {
  var t = CASE_TEMPLATES[caseState.template];
  var pw = t.paywallAfter || 2;

  // If we've hit the paywall point and haven't paid, scroll to doc first
  if (qIndex >= pw && !caseState.paid) {
    // Scroll to PDF preview so user sees their sections
    var docPreview = $('case-doc-preview');
    if (docPreview) {
      docPreview.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // Pulse the last updated section
      var sections = docPreview.querySelectorAll('.case-doc-section:not(.empty):not(.locked)');
      sections.forEach(function(sec) { sec.classList.add('just-updated'); });
    }
    // Delay paywall so user sees the value
    setTimeout(function() {
      showCasePaywall(container);
    }, 1500);
    return;
  }

  if (qIndex >= t.questions.length) {
    buildCaseReview(container);
    return;
  }

  caseState.currentQ = qIndex;
  saveCaseState();
  var q = t.questions[qIndex];

  // Remove previous input wrap if exists
  var prev = container.querySelector('.case-input-active');
  if (prev) prev.remove();

  // Question bubble
  var bubble = el('div', 'case-q-bubble', '');
  var timeLabels = ['about 2 minutes left', 'about 90 seconds left', 'under a minute left', 'about 30 seconds left', 'almost done'];
  var qCounter = qIndex < 5 ? (qIndex + 1) + ' of 5 \u00b7 ' + timeLabels[qIndex] : 'Optional';
  bubble.innerHTML = '<div class="case-q-label">' + qCounter + '</div>' +
    '<div class="case-q-text">' + escapeHtml(q.text) + '</div>';
  container.insertBefore(bubble, $('case-deliverables'));

  // Input area
  var inputWrap = el('div', 'case-input-wrap case-input-active', '');

  if (q.type === 'textarea') {
    var ta = document.createElement('textarea');
    ta.placeholder = getCustomPlaceholder(q, qIndex);
    ta.id = 'case-input-' + q.id;
    inputWrap.appendChild(ta);
  } else if (q.type === 'row') {
    var fieldLabels = {
      role: 'Your role / title',
      tenure: 'Time since last raise',
      company_tenure: 'Time at this company',
      role_duration: 'Time in this role',
      current: 'Current salary',
      target: 'Target salary',
      stay_number: 'Number to stay',
      current_title: 'Your current title',
      hired_as: 'What you were hired as',
      duration: 'How long doing the extra work',
      last_raise: 'When was your last raise',
      location: 'Your city',
      old_title: 'Previous title',
      new_title: 'New title',
      market_rate: 'Market rate for new title',
      deadline: 'Offer expires',
      decision_date: 'Need answer by'
    };
    var row = el('div', 'case-row', '');
    q.fields.forEach(function(f) {
      var fieldGroup = el('div', 'case-field-group', '');
      var label = document.createElement('label');
      label.className = 'case-field-label';
      label.textContent = fieldLabels[f.name] || f.name;
      label.setAttribute('for', 'case-input-' + q.id + '-' + f.name);
      fieldGroup.appendChild(label);
      var inp = document.createElement('input');
      inp.type = f.type || 'text';
      inp.placeholder = f.placeholder || '';
      inp.id = 'case-input-' + q.id + '-' + f.name;
      fieldGroup.appendChild(inp);
      row.appendChild(fieldGroup);
    });
    inputWrap.appendChild(row);
  } else {
    var inp2 = document.createElement('input');
    inp2.type = 'text';
    inp2.placeholder = getCustomPlaceholder(q, qIndex);
    inp2.id = 'case-input-' + q.id;
    inputWrap.appendChild(inp2);
  }

  // Buttons
  var btnWrap = el('div', '', '');
  btnWrap.style.cssText = 'margin-top:10px;margin-bottom:8px;display:flex;align-items:center;';
  var nextBtn = document.createElement('button');
  nextBtn.className = 'case-next-btn';
  nextBtn.textContent = qIndex < t.questions.length - 1 ? 'Next \u2192' : 'Build my raise case \u2192';
  nextBtn.onclick = function() { handleCaseAnswer(container, qIndex); };
  btnWrap.appendChild(nextBtn);

  if (q.optional) {
    var skipBtn = document.createElement('button');
    skipBtn.className = 'case-skip-btn';
    skipBtn.textContent = 'Skip';
    skipBtn.onclick = function() {
      caseState.answers[q.id] = '';
      showCaseQuestion(container, qIndex + 1);
    };
    btnWrap.appendChild(skipBtn);
  }

  inputWrap.appendChild(btnWrap);
  container.insertBefore(inputWrap, $('case-deliverables'));

  // Focus first input
  setTimeout(function() {
    var first = inputWrap.querySelector('input,textarea');
    if (first) first.focus();
  }, 100);

  // Scroll question into view
  setTimeout(function() {
    bubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}

function showCasePaywall(container) {
  var t = CASE_TEMPLATES[caseState.template];
  var pw = t.paywallAfter || 2;

  var active = container.querySelector('.case-input-active');
  if (active) active.remove();

  // Inject paywall using the canonical appendStandardPaywall
  var paywall = el('div', 'coach-msg', '');
  paywall.id = 'case-paywall';
  var deliverables = $('case-deliverables');
  if (deliverables) {
    deliverables.parentNode.insertBefore(paywall, deliverables.nextSibling);
  } else {
    container.appendChild(paywall);
  }
  appendStandardPaywall(paywall, { mode: 'case' });
  logSession('case_paywall_shown', { template: caseState.template, paywall_seen: true });

  // Now lock sections beyond paywall threshold
  for (var li = pw; li < t.sections.length; li++) {
    var sec = $('case-sec-' + li);
    if (sec) {
      sec.classList.remove('empty');
      sec.classList.add('locked');
      var txt = sec.querySelector('.case-doc-section-text');
      if (txt) txt.textContent = 'This section unlocks after purchase\u2026';
    }
  }

  // Make locked sections clickable \u2192 scroll to paywall
  var preview = $('case-doc-preview');
  if (preview) {
    preview.querySelectorAll('.case-doc-section.locked').forEach(function(sec) {
      sec.style.cursor = 'pointer';
      sec.onclick = function() { paywall.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    });
  }
}

function handleCaseAnswer(container, qIndex) {
  var t = CASE_TEMPLATES[caseState.template];
  var q = t.questions[qIndex];
  var answer = '';

  if (q.type === 'row') {
    var parts = {};
    q.fields.forEach(function(f) {
      var inp = $('case-input-' + q.id + '-' + f.name);
      parts[f.name] = inp ? inp.value.trim() : '';
    });
    answer = JSON.stringify(parts);
    // Check at least one field filled
    if (!Object.values(parts).some(function(v) { return v.length > 0; })) {
      q.fields.forEach(function(f) {
        var inp = $('case-input-' + q.id + '-' + f.name);
        if (inp && !inp.value.trim()) {
          inp.classList.add('input-error');
          setTimeout(function() { inp.classList.remove('input-error'); }, 1500);
        }
      });
      return;
    }
  } else {
    var inp = $('case-input-' + q.id);
    answer = inp ? inp.value.trim() : '';
    if (!answer && !q.optional) {
      if (inp) {
        inp.classList.add('input-error');
        setTimeout(function() { inp.classList.remove('input-error'); }, 1500);
      }
      return;
    }
  }

  caseState.answers[q.id] = answer;

  // Log case question answers
  logSession('case_q' + (qIndex + 1), { template: caseState.template, question: q.id });

  // Show deliverables after Q1
  if (qIndex === 0) {
    var deliv = $('case-deliverables');
    if (deliv) deliv.style.display = '';
  }

  // Update doc header with user info from Q1
  if (qIndex === 0 && q.type === 'row') {
    try {
      var p = JSON.parse(answer);
      var nameEl = document.getElementById('case-doc-name');
      var roleEl = document.getElementById('case-doc-role');
      var title = p.role || p.current_title || p.new_title || '';
      var context = '';
      if ((p.tenure || p.company_tenure) && (p.role || !p.current_title)) {
        var tmplKey = caseState.template;
        var dur = formatDuration(p.tenure);
        var tenureVal = p.tenure || p.company_tenure;
        var dur = formatDuration(tenureVal);
        if (tmplKey === 'offer') context = dur + ' at the company';
        else if (tmplKey === 'market') context = dur + ' in this role';
        else context = dur + ' since last raise';
      }
      else if (p.hired_as) context = 'Originally hired as ' + p.hired_as;
      else if (p.duration) context = formatDuration(p.duration) + ' doing the extra work';
      else if (p.location) context = p.location;
      else if (p.old_title) context = 'Previously ' + p.old_title;
      if (nameEl && title) nameEl.textContent = title;
      if (roleEl) roleEl.textContent = context;
    } catch(e) {}
  } else if (qIndex === 0 && q.type !== 'row') {
    var nameEl2 = document.getElementById('case-doc-name');
    if (nameEl2 && answer) nameEl2.textContent = answer;
  }

  saveCaseState();

  // Update doc preview section
  updateCaseDocSection(q.section, q, answer);

  // Remove the input — confirmation bubble replaces it
  var active = container.querySelector('.case-input-active');
  if (active) active.remove();

  // Show user's answer as a confirmation bubble

function parseResultCards(text) {
  var lines = text.split(/\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l; });
  var cards = [];
  lines.forEach(function(l) {
    l = l.replace(/^[\u2022\-\*\d\.\)]+\s*/, '');
    var m = l.match(/^\*\*(.+?)\*\*\s*[\u2014\-:]\s*(.+)$/) || l.match(/^(.{2,40}?)\s+[\u2014]\s+(.+)$/);
    if (m) {
      cards.push({ title: m[1].replace(/\*\*/g, '').trim(), desc: m[2].trim() });
    } else if (l.replace(/\*\*/g, '').trim()) {
      cards.push({ title: '', desc: l.replace(/\*\*/g, '').trim() });
    }
  });
  return cards;
}

function renderCaseSection(text, sectionIndex) {
  if (!text) return '';
  var accent = (CASE_TEMPLATES[caseState.template] || {}).accent || '#3a6ea5';

  var askM = text.match(/\[\[ask\]\]\s*(.+?)\s*\|\s*(.+)/);
  if (askM) {
    return '<div class="case-ask-box"><div class="case-ask-label">Proposed adjustment</div>' +
      '<div class="case-ask-numbers">' + escapeHtml(askM[1]) + '</div>' +
      '<div class="case-ask-sub">' + escapeHtml(askM[2]) + '</div></div>';
  }
  if (/\[\[callout\]\]/.test(text)) {
    var ctxt = text.replace(/\[\[callout\]\]\s*/, '');
    return '<div class="case-callout"><p>' + escapeHtml(ctxt) + '</p></div>';
  }
  var badgeM = text.match(/\[\[badges:\s*(.+?)\]\]/);
  if (badgeM) {
    var prose = text.replace(/\[\[badges:.+?\]\]/, '').trim();
    var html = prose ? '<p>' + escapeHtml(prose) + '</p>' : '';
    html += '<div class="case-badges">';
    badgeM[1].split('|').forEach(function(b) {
      b = b.trim();
      var gold = /^gold:/.test(b);
      if (gold) b = b.replace(/^gold:\s*/, '');
      html += '<span class="case-badge' + (gold ? ' gold' : '') + '">' + escapeHtml(b) + '</span>';
    });
    html += '</div>';
    return html;
  }
  var cardIdx = CASE_CARD_SECTIONS[caseState.template];
  if (cardIdx === sectionIndex) {
    var cards = parseResultCards(text);
    if (cards.length) {
      var h = '';
      cards.forEach(function(c) {
        h += '<div class="case-result-card" style="border-left-color:' + accent + ';">';
        if (c.title) h += '<p class="case-result-title" style="color:' + accent + ';">' + escapeHtml(c.title) + '</p>';
        h += '<p class="case-result-desc">' + escapeHtml(c.desc) + '</p>';
        h += '</div>';
      });
      return h;
    }
  }
  return formatPolishedText(text);
}

function formatPolishedText(text) {
  if (!text) return '';
  // Split on bullet markers (•, -, *) at line start or after newline
  var lines = text.split(/\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l; });
  var hasBullets = lines.some(function(l) { return /^[\u2022\-\*]\s/.test(l); });
  if (hasBullets) {
    var html = '';
    var inList = false;
    lines.forEach(function(l) {
      if (/^[\u2022\-\*]\s/.test(l)) {
        if (!inList) { html += '<ul class="case-doc-bullets">'; inList = true; }
        html += '<li>' + escapeHtml(l.replace(/^[\u2022\-\*]\s*/, '')) + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<p style="margin:0 0 6px;">' + escapeHtml(l) + '</p>';
      }
    });
    if (inList) html += '</ul>';
    return html;
  }
  // Inline bullets (• without newlines)
  if (text.indexOf('\u2022') > 0) {
    var parts = text.split('\u2022').map(function(p) { return p.trim(); }).filter(function(p) { return p; });
    if (parts.length > 1) {
      return '<ul class="case-doc-bullets">' + parts.map(function(p) { return '<li>' + escapeHtml(p) + '</li>'; }).join('') + '</ul>';
    }
  }
  return escapeHtml(text);
}

function updateCaseDocSection(sectionIndex, q, answer) {
  var sec = $('case-sec-' + sectionIndex);
  if (!sec) return;
  sec.classList.remove('empty');
  sec.classList.add('generating');
  var textEl = sec.querySelector('.case-doc-section-text');
  if (textEl) textEl.textContent = 'Writing this section\u2026';

  var t = CASE_TEMPLATES[caseState.template];

  // Call AI polish API
  fetch('/api/raise-coach', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      mode: 'case_polish',
      template: caseState.template,
      section_index: sectionIndex,
      section_name: t.sections[sectionIndex],
      question_text: q.text,
      raw_answer: answer,
      all_answers: caseState.answers,
      tone_context: caseState.tone || '',
      q2_text: t.questions[1] ? t.questions[1].text : '',
    }),
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    sec.classList.remove('generating');
    sec.classList.remove('empty');
    sec.classList.add('just-updated');
    var polished = data.polished || answer;
    caseState.polished[sectionIndex] = polished;
    saveCaseState();
    if (textEl) textEl.innerHTML = renderCaseSection(polished, sectionIndex);

    // Update Q2 placeholder with AI-generated example
    if (data.q2_placeholder && sectionIndex === 0) {
      var t = CASE_TEMPLATES[caseState.template];
      if (t && t.questions[1]) {
        var q2Input = $('case-input-' + t.questions[1].id);
        if (q2Input) q2Input.placeholder = data.q2_placeholder;
      }
    }
  })
  .catch(function(err) {
    console.error('[case_polish] fetch error:', err);
    sec.classList.remove('generating');
    // Fallback: show raw answer
    var displayText = answer;
    if (q.type === 'row') {
      try {
        var p = JSON.parse(answer);
        displayText = Object.entries(p).map(function(e) {
          return e[0].charAt(0).toUpperCase() + e[0].slice(1) + ': ' + e[1];
        }).filter(function(s) { return !s.endsWith(': '); }).join(' \u2022 ');
      } catch(e) {}
    }
    caseState.polished[sectionIndex] = displayText;
    if (textEl) textEl.innerHTML = renderCaseSection(displayText, sectionIndex);
  });
}

// Generate AI coaching insight based on practice action
async function generateCoachingInsight(action, context) {
  let directionLabel = '';
  if (action === 'opening_picked') {
    directionLabel = 'Your opening: ' + (context?.theme || 'Direct approach');
  } else if (action === 'scenario_selected') {
    directionLabel = 'Manager response: ' + (context?.scenario_type || '').replace(/^["'\u201c\u201d]+|["'\u201c\u201d]+$/g, '');
  } else if (action === 'reply_chosen') {
    directionLabel = 'Your reply: ' + (context?.reply_theme || 'Direct response');
  }

  try {
    const res = await fetch('/api/raise-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'coaching_insight',
        action: action,
        context: context,
        conversation_history: simConversation,
        blocker: SIM_STATE.blocker,
        session_id: profileHash(),
      }),
    });
    const data = await res.json();
    // Populate the tip card gist in practice mode
    if (data.gist) {
      populateTipCard(data.gist);
    } else {
      populateTipCard(null);
    }
    // Full insight goes to coaching mode
    if (data.insight) {
      addCoachingInsight(data.insight, 'insight', directionLabel);
    }
  } catch (err) {
    populateTipCard(null);
    const fallbacks = {
      opening_picked: "Good choice. Your opening sets the tone for the entire conversation.",
      scenario_selected: "Your manager's response reveals what they really think about your ask.",
      reply_chosen: "The best negotiators match their manager's energy.",
    };
    addCoachingInsight(fallbacks[action] || "Your coach is analyzing your approach...", 'insight', directionLabel);
  }

// ── Markdown rendering for coach output ──
// The coach API returns Markdown ( **bold**, *italic*, ## headers,
// paragraph breaks). We render a safe subset. Without this, raw asterisks
// and hashes appear in the chat — which is what made the coaching message
// look like a wall of text in earlier screenshots.
function renderMarkdownToHtml(md) {
  if (!md) return '';
  // Escape HTML first so user/model output can't inject tags
  let s = md.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);

  // Headers (## or ###) become <h3>
  s = s.replace(/^#{2,3}\s+(.+)$/gm, '<h3>$1</h3>');
  // Bold **text** → <strong> (process before italic so *bold* doesn't conflict)
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  // Italic *text* → <em>
  s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  // Paragraph breaks: split on blank lines, wrap each block in <p>
  // (skip wrapping if the block is already an <h3>)
  const blocks = s.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => /^<h3>/.test(b) ? b : `<p>${b.replace(/\n/g, ' ')}</p>`).join('');
}

// ── Path B: Chip click → coach insight → timing → simulation at blocker ──
async function beginSimulationFlow(reasonParam) {
  const blocker = BLOCKER_MAP[reasonParam] || BLOCKER_MAP.other;
  SIM_STATE.blocker = blocker;
  SIM_STATE.context = {};
  SIM_STATE.branch_history = [];
  tipsShown.clear(); // Reset tips for new blocker flow
  // so users can't get free taps by switching blockers

  // If user already hit the paywall in a previous session,
  // go straight to Canvas mode with locked Practice/Coaching.
  if (state.paywall_shown && !state.paid) {
    state.obstacle = blocker;
    state.current_exchange = 10;
    state.sim_reason = reasonParam;
    state.sim_session_id = 'simB_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    state.chat_log = [];
    state.profile = state.profile || { country: 'us', company_situation: 'stable', last_raise: '1_2_years', seniority: 'mid', company_size: '250_1000' };
    saveState();
    stopThinkingAnimation();
    const thinkBubble = document.querySelector('.thinking-bubble');
    if (thinkBubble) thinkBubble.remove();
    const probCard = document.querySelector('.prob-card');
    if (probCard) probCard.style.display = 'none';

    showToolbar();
    showModeToggle();
    unlockModeToggle();
    setMode(SIM_STATE.entryMode === 'sim' ? 'sim' : SIM_STATE.entryMode === 'coach' ? 'coach' : 'discovery');
    return;
  }

  state.profile = { country: 'us', company_situation: 'stable', last_raise: '1_2_years', seniority: 'mid', company_size: '250_1000' };
  state.obstacle = blocker;
  state.chat_log = [];
  state.current_exchange = 10;
  state.sim_reason = reasonParam;
  const previousSessionId = state.sim_session_id || '';
  state.sim_session_id = 'simB_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  saveState();

  logSession('sim_start', {
    blocker_code: blocker.code,
    blocker_label: blocker.label,
    obstacle_code: blocker.code,
    landing_ref: reasonParam,
    path: 'B',
    country: 'unknown',
    seniority: 'unknown',
    previous_session_id: previousSessionId,
  });

  // Go straight to opening lines — no mini demo, no ACK, no waiting
  startSimulationAtBlocker();
}

  function drawBoldText(doc, text, x, y, maxWidth, color) {
    var parts = text.split(/(\*\*[^*]+?\*\*)/g);
    var lines = [];
    var currentLine = [];
    var currentWidth = 0;
    parts.forEach(function(part) {
      var isBold = part.startsWith('**') && part.endsWith('**');
      var clean = isBold ? part.slice(2, -2) : part;
      var words = clean.split(' ');
      words.forEach(function(word) {
        if (!word) return;
        var prefix = currentLine.length > 0 ? ' ' : '';
        doc.setFont('helvetica', isBold ? 'bold' : 'normal');
        var w = doc.getTextWidth(prefix + word);
        if (currentWidth + w > maxWidth && currentLine.length > 0) {
          lines.push(currentLine.slice());
          currentLine = [{ text: word, bold: isBold }];
          currentWidth = doc.getTextWidth(word);
        } else {
          currentLine.push({ text: prefix + word, bold: isBold });
          currentWidth += w;
        }
      });
    });
    if (currentLine.length > 0) lines.push(currentLine);
    lines.forEach(function(line, li) {
      var cx = x;
      line.forEach(function(seg) {
        doc.setFont('helvetica', seg.bold ? 'bold' : 'normal');
        doc.setTextColor(color[0], color[1], color[2]);

function calculateNegotiationScore() {
  var e = discDims.evidence || 0;
  var m = discDims.manager || 0;
  var t = discDims.timing || 0;
  var c = discDims.company || 0;
  var k = discDims.market || 0;

  // Step 1: Weighted base
  var base = (e * 0.25) + (m * 0.25) + (t * 0.20) + (c * 0.15) + (k * 0.15);

  // Step 2: Weak penalty (dims < 40)
  var weakCount = [e,m,t,c,k].filter(function(d) { return d < 40; }).length;
  var weakPenalty = weakCount === 0 ? 0 : weakCount === 1 ? -5 : weakCount === 2 ? -8 : -10;

  // Step 3: Strength bonus (dims >= 70)
  var strongCount = [e,m,t,c,k].filter(function(d) { return d >= 70; }).length;
  var strongBonus = strongCount <= 1 ? 0 : strongCount === 2 ? 3 : strongCount === 3 ? 5 : 8;

  // Step 4: Critical combos
  var comboBonus = 0;
  if (e >= 70 && m >= 60) comboBonus += 4;
  if (e < 40 && m < 40) comboBonus -= 6;
  if (t < 30) comboBonus -= 3;
  if (e >= 70 && k >= 70) comboBonus += 3;

  // Step 5: Clamp
  var final = Math.max(10, Math.min(95, base + weakPenalty + strongBonus + comboBonus));
  return Math.round(final);
}

function getNegotiationLabel(score) {
  if (score >= 72) return { label: 'Strong negotiating position', color: '#0a5c3a', bg: '#E8F7F0', border: 'rgba(26,158,108,0.2)', target: 'Negotiate the amount \u2014 push for the upper range and negotiate extras like title, bonus, or review date.', risk: 'Appearing overconfident or under-asking \u2014 leaving thousands on the table by accepting their first counter. Your pushback responses matter most.' };
  if (score >= 55) return { label: 'Solid position \u2014 preparation needed', color: '#3d6b1e', bg: '#EEF6E8', border: 'rgba(80,140,40,0.2)', target: 'Secure a specific raise with a committed timeline in writing.', risk: 'Getting deflected to next cycle or accepting a vague timeline without numbers. Your opening script needs to lock specifics.' };
  if (score >= 40) return { label: 'Viable \u2014 right approach matters', color: '#6a4a10', bg: '#FDF5E6', border: 'rgba(201,168,76,0.2)', target: 'Open the conversation seriously and lock in a review date.', risk: 'Walking in unprepared and either freezing or accepting the first \u2018no\u2019 as final. Your pushback prep is the difference.' };
  if (score >= 25) return { label: 'Challenging \u2014 strategy is everything', color: '#b45a00', bg: '#FFF4E6', border: 'rgba(200,120,20,0.2)', target: 'Build your case with your manager and establish a clear path to a raise.', risk: 'Asking with weak framing and getting a vague \u2018maybe later\u2019. Your case framing and emphasize section matter most.' };
  return { label: 'Early stage \u2014 groundwork first', color: '#7a2020', bg: '#FCEBEB', border: 'rgba(204,68,68,0.2)', target: 'Plant the seed, increase visibility, and create conditions for 2\u20133 months from now.', risk: 'Asking now and being shut down before you\u2019ve built the ground. Your timing and avoid section matter most.' };
}

function drawDiscRadarOnCanvas(canvas) {
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = 240, h = 240, cx = 120, cy = 120, r = 65;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(dpr, dpr);

  var labels = ['Evidence','Timing','Market','Manager','Company'];
  var keys = ['evidence','timing','market','manager','company'];
  var activeColor = 'rgba(30,61,114,0.85)';
  var inactiveColor = 'rgba(128,128,128,0.3)';
  var n = 5;

  for (var ring = 3; ring >= 1; ring--) {
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (Math.PI * 2 * (i % n) / n) - Math.PI / 2;
      var rr = r * ring / 3;
      if (i === 0) ctx.moveTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a));
      else ctx.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a));
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(128,128,128,0.12)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  for (var i = 0; i < n; i++) {
    var a = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.strokeStyle = 'rgba(128,128,128,0.12)'; ctx.lineWidth = 0.5; ctx.stroke();

    var lx = cx + (r + 16) * Math.cos(a);
    var ly = cy + (r + 16) * Math.sin(a);
    ctx.fillStyle = discActive[keys[i]] ? activeColor : inactiveColor;
    ctx.font = (discActive[keys[i]] ? '600 ' : '400 ') + '11px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
  }

  var hasActive = keys.some(function(k) { return discActive[k]; });
  if (hasActive) {
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (Math.PI * 2 * (i % n) / n) - Math.PI / 2;
      var k = keys[i % n];
      var v = discActive[k] ? (discDims[k] / 100) : 0;
      var x = cx + r * v * Math.cos(a);
      var y = cy + r * v * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(30,61,114,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,61,114,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    for (var i = 0; i < n; i++) {
      if (!discActive[keys[i]]) continue;
      var a = (Math.PI * 2 * i / n) - Math.PI / 2;
      var v = discDims[keys[i]] / 100;
      ctx.beginPath();
      ctx.arc(cx + r * v * Math.cos(a), cy + r * v * Math.sin(a), 4, 0, Math.PI * 2);
      ctx.fillStyle = discDims[keys[i]] >= 60 ? '#00c4a0' : discDims[keys[i]] >= 40 ? '#c9a84c' : '#E05555';
      ctx.fill();
    }
  }

  ctx.restore();
}


// Animate radar — dots slide along their axis spoke
var _radarAnimFrame = null;
function animateDiscRadar(canvas) {
  if (_radarAnimFrame) { cancelAnimationFrame(_radarAnimFrame); _radarAnimFrame = null; }
  if (!canvas) return;
  var keys = ['evidence','timing','market','manager','company'];
  var start = null;
  function frame(ts) {
    if (!start) start = ts;
    var c = canvas;
    if (!c || !c.isConnected) { _radarAnimFrame = null; return; }
    drawDiscRadarOnCanvas(c);
    var ctx2 = c.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var cx = 120, cy = 120, r = 65, n = 5;
    ctx2.save();
    ctx2.scale(dpr, dpr);
    for (var i = 0; i < n; i++) {
      if (discActive[keys[i]]) continue;
      var a = (Math.PI * 2 * i / n) - Math.PI / 2;
      // All dots pulse together — same phase, all big then all small
      var t = (ts - start) / 3000; // 3s cycle
      var size = 3 + 1.5 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2));
      var px = cx + r * 0.2 * Math.cos(a);
      var py = cy + r * 0.2 * Math.sin(a);
      ctx2.beginPath();
      ctx2.arc(px, py, size, 0, Math.PI * 2);
      ctx2.fillStyle = 'rgba(201,168,76,0.55)';
      ctx2.fill();
    }
    ctx2.restore();
    _radarAnimFrame = requestAnimationFrame(frame);
  }
  _radarAnimFrame = requestAnimationFrame(frame);
}

function pickDiscAnswer(qIdx, opt, pill) {
  var opts = $('disc-opts-' + qIdx);
  if (!opts) return;
  
  opts.querySelectorAll('.sim-reply-pill').forEach(function(p) {
    p.disabled = true;
    p.style.opacity = '0.35';
    p.style.pointerEvents = 'none';
    p.classList.remove('active');
  });
  pill.style.opacity = '1';
  pill.classList.add('active');

  var chatArea = $('disc-chat');
  var userBubble = el('div', 'user-msg', '');
  userBubble.innerHTML = '<div class="user-bubble">' + escapeHtml(opt.text) + '</div>';
  chatArea.appendChild(userBubble);

  // Update scores
  var q = discOrderedQuestions[qIdx];
  var primaryDim = q.dimTag;
  Object.keys(opt.scores).forEach(function(k) {
    if (k === primaryDim) {
      // Direct answer: OVERRIDE score (don't Math.max)
      discDims[k] = opt.scores[k];
      discActive[k] = true;
    } else {
      // Cross-dimension hint: only boost if not directly answered yet
      if (!discActive[k]) {
        discDims[k] = Math.max(discDims[k] || 0, opt.scores[k]);
        // Don't set discActive — this dimension hasn't been directly answered
      }
    }
  });
  if (opt.type === 'lever') discLevers.push(opt.note);
  if (opt.type === 'weak') discWeaks.push(opt.note);

  // Update canvas block for this dimension
  SIM_STATE.context[q.id] = opt.val;
  if (q.dimTag && discCanvasBlocks[q.dimTag]) {
    discCanvasBlocks[q.dimTag].filled = true;
    var dimScore = discDims[q.dimTag] || 0;
    discCanvasBlocks[q.dimTag].strength = dimScore >= 60 ? 'strong' : dimScore >= 40 ? 'neutral' : 'weak';
    discCanvasBlocks[q.dimTag].note = opt.note;
    discCanvasBlocks[q.dimTag].insight = opt.note; // placeholder until AI generates
  }

  // Save to localStorage
  try {
    state.discovery = {
      dims: JSON.parse(JSON.stringify(discDims)),
      active: JSON.parse(JSON.stringify(discActive)),
      levers: discLevers.slice(),
      weaks: discWeaks.slice(),
      step: discStep + 1,
      insights: discInsights,
      canvasBlocks: discCanvasBlocks,
      answers: state.discovery ? state.discovery.answers || {} : {}
    };
    state.discovery.answers[q.id] = opt.val;
    saveState();
  } catch (e) {}

  logEntry('disc_answer', { question: q.id, dimension: q.dimTag, answer: opt.val, note: opt.note, type: opt.type });
  logSession('disc_' + q.id, { answer: opt.val, type: opt.type, step: discStep + 1 });

  if (_radarAnimFrame) { cancelAnimationFrame(_radarAnimFrame); _radarAnimFrame = null; }
  insertDiscRadar();

  // Smooth scroll to user's answer
  setTimeout(function() {
    var chatWrap = $('chat-wrap');
    if (chatWrap && userBubble) {
      var target = userBubble.offsetTop - 20;
      var start = chatWrap.scrollTop;
      var distance = target - start;
      var duration = 1500;
      var startTime = null;
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        chatWrap.scrollTop = start + distance * easeOut(progress);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }, 200);
  
  discStep++;
  setTimeout(function() {
    renderDiscQuestion(discStep);
  }, 2200);
}

var tailorAnswers = {};
var tailorStep = 0;

function highlightPlanCards(keys) {
  var canvas = $('disc-canvas-live');
  if (!canvas) return;
  highlightPlanCardsIn(canvas, keys);
}

function highlightPlanCardsIn(container, keys) {
  keys.forEach(function(key) {
    var card = container.querySelector('[data-block-key="' + key + '"]');
    if (!card) return;
    card.classList.add('plan-tailored', 'plan-tailored-animate');
    // Add badge after the header row, not inside it, to avoid flex overflow
    if (!card.querySelector('.tailor-badge')) {
      var badge = document.createElement('div');
      badge.className = 'tailor-badge';
      badge.style.cssText = 'margin-top:6px;display:inline-block;';
      badge.textContent = '✓ Tailored';
      card.insertBefore(badge, card.querySelector('p'));
    }
    setTimeout(function() { card.classList.remove('plan-tailored-animate'); }, 500);
  });
}

function showTailorQuestion(chatArea, idx) {
  if (idx >= POST_PAYWALL_QS.length) {
    // All 3 done

    // 1. Collapse the canvas above the paywall
    var oldCanvas = $('disc-canvas-live');
    if (oldCanvas) {
      oldCanvas.style.transition = 'max-height 0.5s ease, opacity 0.4s ease';
      oldCanvas.style.overflow = 'hidden';
      oldCanvas.style.maxHeight = oldCanvas.scrollHeight + 'px';
      requestAnimationFrame(function() {
        oldCanvas.style.maxHeight = '0';
        oldCanvas.style.opacity = '0';
      });
    }

    // 2. Render fresh canvas below
    var newCanvasWrap = el('div', 'coach-msg', '');
    var newCanvasDiv = el('div', '', '');
    newCanvasDiv.id = 'disc-canvas-tailored';
    setCanvasHTML(newCanvasDiv);
    newCanvasWrap.appendChild(newCanvasDiv);
    chatArea.appendChild(newCanvasWrap);

    // 3. Re-apply highlights on new canvas + always tag opening_script
    setTimeout(function() {
      var newCanvas = $('disc-canvas-tailored');
      if (newCanvas) {
        // Always tag opening script — it's always affected by tailor answers
        highlightPlanCardsIn(newCanvas, ['opening_script']);
        Object.values(tailorAnswers).forEach(function(val) {
          POST_PAYWALL_QS.forEach(function(q) {
            q.chips.forEach(function(chip) {
              if (chip.val === val) highlightPlanCardsIn(newCanvas, chip.keys);
            });
          });
        });
      }
    }, 100);

    // 4. Update paywall CTA
    var btn = chatArea.querySelector('.btn-pay');
    if (btn) btn.innerHTML = 'Your plan is tailored \u2014 unlock it now \u00b7 $' + PRICE_USD + ' <span class="btn-pay-arrow">\u2192</span>';

    // 5. Done bubble
    var doneWrap = el('div', 'coach-msg', '');
    doneWrap.innerHTML = '<div class="bubble"><p>Your plan has been updated. <a href="#" onclick="event.preventDefault();var pw=document.querySelector(\'.paywall-bubble\');if(pw)pw.scrollIntoView({behavior:\'smooth\'})" style="color:var(--gold);font-weight:700;text-decoration:none;">Unlock it to see everything \u2192</a></p></div>';
    chatArea.appendChild(doneWrap);

    setTimeout(function() {
      var w = $('chat-wrap');
      if (!w) return;
      var start = w.scrollTop;
      var target = w.scrollHeight - w.clientHeight;
      var distance = target - start;
      var duration = 2000;
      var startTime = null;
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        w.scrollTop = start + distance * easeInOutCubic(progress);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, 600);
    return;
  }

  var q = POST_PAYWALL_QS[idx];
  var qWrap = el('div', 'coach-msg', '');
  qWrap.innerHTML = '<div class="bubble"><p>' + q.text + '</p></div>';
  chatArea.appendChild(qWrap);

  // Chips
  var chipsWrap = el('div', 'coach-msg', '');
  var opts = el('div', 'sim-pills-row', '');
  opts.style.alignItems = 'flex-start';
  q.chips.forEach(function(chip) {
    var pill = el('button', 'sim-reply-pill', '');
    pill.style.flexDirection = 'row';
    pill.style.alignItems = 'center';
    pill.style.gap = '10px';
    var radio = el('div', 'chip-radio', '');
    pill.appendChild(radio);
    var textSpan = el('span', '', '');
    textSpan.style.cssText = 'font-size:12.5px;line-height:1.5;color:var(--t2);flex:1;';
    textSpan.textContent = chip.text;
    pill.appendChild(textSpan);
    pill.onclick = function() {
      // Dim all, highlight selected
      opts.querySelectorAll('.sim-reply-pill').forEach(function(p) {
        p.disabled = true;
        p.style.opacity = '0.35';
        p.style.pointerEvents = 'none';
      });
      pill.style.opacity = '1';
      pill.classList.add('active');

      // User bubble
      var userWrap = el('div', 'user-msg', '');
      userWrap.innerHTML = '<div class="user-bubble">' + chip.text + '</div>';
      chatArea.appendChild(userWrap);

      // Store answer
      tailorAnswers[q.id] = chip.val;

      // Highlight cards
      highlightPlanCards(chip.keys);

      // Scroll to user bubble (same as pickDiscAnswer)
      setTimeout(function() {
        var chatWrap = $('chat-wrap');
        if (chatWrap && userWrap) {
          var target = userWrap.offsetTop - 20;
          var start = chatWrap.scrollTop;
          var distance = target - start;
          var duration = 1500;
          var startTime = null;
          function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
          function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            chatWrap.scrollTop = start + distance * easeOut(progress);
            if (progress < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }
      }, 200);

      // Next question after pause — faster than original 5 questions
      setTimeout(function() {
        showTailorQuestion(chatArea, idx + 1);
      }, 800);
    };
    opts.appendChild(pill);
  });
  chipsWrap.appendChild(opts);
  chatArea.appendChild(chipsWrap);

  // Smooth scroll to question bubble — same as renderDiscQuestion (1800ms, easeInOutCubic, 300ms delay)
  setTimeout(function() {
    var wrap = $('chat-wrap');
    if (wrap && qWrap) {
      var target = qWrap.offsetTop - 10;
      var start = wrap.scrollTop;
      var distance = target - start;
      var duration = 1800;
      var startTime = null;
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        wrap.scrollTop = start + distance * easeInOutCubic(progress);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }, 300);
}

async function pickOpening(opener, pill, container) {
  // If paywall already shown, nudge user to the CTA
  if (state.paywall_shown && !state.paid) {
    return;
  }

  // Show mode banner on first tap (not before)
  if (!document.querySelector('.mode-banner')) {
    insertModeBanner('sim');
  }

  // Remove gift tip banner on first tap
  const giftBanner = document.getElementById('tip-gift-banner');
  if (giftBanner) { giftBanner.style.transition = 'opacity 0.2s, max-height 0.3s'; giftBanner.style.opacity = '0'; giftBanner.style.maxHeight = '0'; giftBanner.style.overflow = 'hidden'; setTimeout(() => giftBanner.remove(), 300); }

  // Disable all pills
  container.querySelectorAll('.sim-reply-pill').forEach(p => {
    p.classList.toggle('active', p === pill);
    p.disabled = true;
    p.style.cursor = 'default';
  });

  // Pro tip moves to coaching mode (no longer in practice flow)
  incrementScenariosUnlocked();

  const userBubble = appendUserBubble('I\u2019d open with:\n\u201c' + opener.text + '\u201d\n\n\u2014 ' + opener.theme);
  scrollChatToBottom();
  disableInput('');

  simConversation.push({ role: 'user', text: opener.text });
  SIM_STATE.user_opening = opener.text;
  SIM_STATE.branch_history.push({ scenario: 'opening', reply: opener.theme });
  logSession('sim_opening_picked', { theme: opener.theme });

  // Generate coaching insight in background (preview card shown after framing text)
  generateCoachingInsight('opening_picked', {
    opening: opener.text,
    theme: opener.theme,
    blocker: SIM_STATE.blocker,
  });

  // Add pro tip to coaching mode
  addCoachingProTip(0);

  // Coach preview card appears after user bubble — covers loading time
  showCoachPreviewCard('opening_picked', { theme: opener.theme });

  const turnNodes = [userBubble];
  simTurnElements.push(turnNodes);

  await loadManagerResponseToOpening(opener.text, turnNodes);
}

// After the user picks an opening, generate manager responses to it
async function loadManagerResponseToOpening(openingText, turnNodes) {
  await sleep(400);

  // Show the framing text BEFORE the API call — sets expectation during wait
  await typeCoachBubble("**Now pick what your manager might say to that.**");
  await sleep(200);
  showCoachTyping();

  try {
    const res = await fetchWithTimeout('/api/raise-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'simulate_scenarios',
        blocker: SIM_STATE.blocker,
        context: { ...SIM_STATE.context, user_opening: openingText },
        session_id: profileHash(),
      }),
    }, 15000);
    const data = await res.json();
    hideCoachTyping();

    if (data && data.scenarios && data.scenarios.length >= 2) {
      renderScenarioLabels(data.scenarios);
    } else {
      renderScenarioLabels(getDefaultScenarios(SIM_STATE.blocker.code));
    }
  } catch (err) {
    hideCoachTyping();
    renderScenarioLabels(getDefaultScenarios(SIM_STATE.blocker.code));
  }
}
