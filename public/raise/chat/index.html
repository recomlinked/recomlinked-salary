/* ───────────────────────────────────────────────────────── */
/* ── Post-paywall text: useful answer + dynamic CTA tail  ── */
/* ───────────────────────────────────────────────────────── */

// After paywall appears, user free-text still engages the coach via
// /api/raise-coach free-mode. Each reply includes a dynamic CTA tail.
// After FREE_DIALOG_LIMIT messages, we switch to paywall-lock mode where
// the replies are terse and the CTA is the full message — prevents the
// free chat from becoming the product.
async function handlePostPaywallText(text) {
  appendUserBubble(text);
  disableInput('Thinking…');

  state.free_dialog_count = (state.free_dialog_count || 0) + 1;
  saveState();
  logSession('free_text', { free_text_count: state.free_dialog_count });

  await sleep(300);
  showCoachTyping();

  // Check dialog cap BEFORE calling the API — saves a Claude call when locked
  if (state.free_dialog_count > FREE_DIALOG_LIMIT) {
    await sleep(800);
    hideCoachTyping();
    renderLockedReply(text);
    return;
  }

  // Call the real coach API in free mode. Include session_id and
  // free_dialog_count so the backend can log them into the Raise Leads sheet.
  let reply = null;
  try {
    const res = await fetch('/api/raise-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        profile:               state.profile,
        obstacle:              state.obstacle,
        timing:                state.timing || 'exploring',
        final_range:           state.current_range,
        accumulated_exchanges: state.accumulated,
        message:               text,
        session_id:            profileHash(),
        free_dialog_count:     state.free_dialog_count,
      }),
    });
    if (res.ok) {
      const data = await res.json();
      reply = data.reply || null;
    }
  } catch (e) { /* fall through to fallback */ }

  hideCoachTyping();

  if (!reply) {
    // API unavailable — render a short apologetic bubble without a CTA.
    // Don't count this against the user's free_dialog_count (already incremented).
    const wrap = el('div', 'coach-msg', '');
    wrap.innerHTML = `<div class="bubble"><p>I couldn't respond just now. Try again, or jump into the plan — it has the answers to most questions you'd ask here.</p></div>`;
    $('messages').appendChild(wrap);
    scrollChatToBottom();
    enableInput('Ask me anything…');
    awaitFreeText(handlePostPaywallText);
    return;
  }

  // Render the coach reply + dynamic CTA tail.
  // Main reply text types char-by-char. Tail paragraph + CTA fade in after.
  const remaining = FREE_DIALOG_LIMIT - state.free_dialog_count;
  const tailCopy = remaining > 0
    ? `<strong style="color:var(--t1);">If you want the specific version for your situation</strong> — the exact words, the numbers, the handoff to your manager — that's in your plan. $${PRICE_USD} once.`
    : `<strong style="color:var(--t1);">Last free answer.</strong> The specifics — your exact words, your numbers, your handoff — live in the full plan. $${PRICE_USD} once.`;

  const wrap = el('div', 'coach-msg', '');
  wrap.innerHTML = `
    <div class="bubble">
      <p class="coach-typed"><span class="typed-text"></span><span class="cursor"></span></p>
      <p class="coach-tail" style="color:var(--t2);font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--divider);">${tailCopy}</p>
      <button class="btn-pay coach-tail-btn" style="margin-top:10px;" data-tail-cta>
        Get my plan · $${PRICE_USD} <span class="btn-pay-arrow">→</span>
      </button>
    </div>
  `;
  $('messages').appendChild(wrap);

  const tailEl = wrap.querySelector('.coach-tail');
  const btnEl  = wrap.querySelector('.coach-tail-btn');
  tailEl.style.opacity = '0';
  btnEl.style.opacity  = '0';
  scrollChatToBottom();

  // Type the main reply
  const typedSpan = wrap.querySelector('.typed-text');
  const cursorEl  = wrap.querySelector('.cursor');
  await typeIntoElement(typedSpan, reply);
  if (cursorEl) cursorEl.remove();

  // Fade in the tail + CTA together
  await sleep(200);
  fadeInElement(tailEl);
  fadeInElement(btnEl);

  logEntry('coach_bubble', { text: reply });

  const btn = wrap.querySelector('[data-tail-cta]');
  if (btn) btn.onclick = startCheckout;

  enableInput('Ask me anything…');
  awaitFreeText(handlePostPaywallText);
}

/** Post-cap reply — short, polite, all CTA. Rendered when user has exceeded
    FREE_DIALOG_LIMIT free-text messages. */
async function renderLockedReply(userText) {
  const obs = state.obstacle || { code: 'other' };
  // Three rotating lead-ins so it doesn't feel scripted if they keep typing
  const leadIns = [
    "I can't go further without you on the plan — but I want to. Everything you're asking is in there, answered specifically for you.",
    "The plan is the product. Every answer I'd give you here lives in there, sharper and built around your exact situation.",
    "I've given you what I can for free. The rest is the plan — role-play, exact scripts, 30 days of follow-up.",
  ];
  const lockIdx = Math.min(state.free_dialog_count - FREE_DIALOG_LIMIT - 1, leadIns.length - 1);
  const leadIn = leadIns[Math.max(0, lockIdx)];

  const proof = pickProofLine(obs.code);

  const wrap = el('div', 'coach-msg', '');
  wrap.innerHTML = `
    <div class="paywall-bubble">
      <p class="lock-lead"><span class="lock-typed"></span><span class="lock-cursor"></span></p>
      <button class="btn-pay lock-cta" data-tail-cta>
        Get my plan · $${PRICE_USD} <span class="btn-pay-arrow">→</span>
      </button>
      <div class="trust-row lock-trust">
        <span>Stripe secure</span><span class="dot">·</span><span>One-time</span><span class="dot">·</span><span>No subscription</span>
      </div>
      <div class="proof-line lock-proof">${proof}</div>
    </div>
  `;
  $('messages').appendChild(wrap);

  const btn = wrap.querySelector('[data-tail-cta]');
  if (btn) btn.onclick = startCheckout;

  const ctaEl   = wrap.querySelector('.lock-cta');
  const trustEl = wrap.querySelector('.lock-trust');
  const proofEl = wrap.querySelector('.lock-proof');
  ctaEl.style.opacity   = '0';
  trustEl.style.opacity = '0';
  proofEl.style.opacity = '0';
  scrollChatToBottom();

  // Type the lead-in
  const typedSpan = wrap.querySelector('.lock-typed');
  const cursorEl  = wrap.querySelector('.lock-cursor');
  await typeIntoElement(typedSpan, leadIn);
  if (cursorEl) cursorEl.remove();

  // Fade the rest in
  await sleep(250);
  fadeInElement(ctaEl);
  fadeInElement(trustEl);
  fadeInElement(proofEl);

  // Keep input enabled but user gets the same locked reply each time after this
  enableInput('Ask me anything…');
  awaitFreeText(handlePostPaywallText);
}

/* ── Free-text input wiring ────────────────────────────── */
let pendingSubmitHandler = null;

function awaitFreeText(onSubmit) {
  pendingSubmitHandler = onSubmit;
}

// Static fallback nudges — used ONLY when the backend classifier call fails
// (network error or 500). In normal operation, the backend writes the nudge
// line based on conversation history.
const TEXT_NUDGE_FALLBACKS = {
  1: "Your job title and kind of company, even a short phrase like 'Senior PM at a SaaS startup'.",
  2: "Tap a chip above or give me one sentence on your strongest evidence — a win, an offer, or a sense you're underpaid.",
  4: "Tap a chip above, or type one line about what's worrying you most.",
};

// Tracks how many nudges have fired per exchange in the current session.
const nudgeAttempts = { 1: 0, 2: 0, 4: 0 };

// Currently-displayed coach question per exchange.
const currentQuestion = { 1: '', 2: '', 3: '', 4: '' };

// ── Exchange message helpers ──────────────────────────────
// Turn-by-turn conversation for Ex1/Ex2. Sent to /api/raise-exchange as
// `messages` so the classifier sees cumulative context and decides
// advance/nudge based on meaning, not message length. Ex3 chips + Ex4
// obstacle still use the legacy answer shape.
function pushExchangeMessage(exchange, role, text) {
  if (exchange !== 1 && exchange !== 2) return;
  state.exchange_messages = state.exchange_messages || { 1: [], 2: [] };
  state.exchange_messages[exchange] = state.exchange_messages[exchange] || [];
  state.exchange_messages[exchange].push({ role, text: String(text || '') });
  saveState();
}

function getExchangeMessages(exchange) {
  if (exchange !== 1 && exchange !== 2) return [];
  return (state.exchange_messages?.[exchange] || []).slice();
}

function clearExchangeMessages(exchange) {
  if (!state.exchange_messages) state.exchange_messages = { 1: [], 2: [] };
  state.exchange_messages[exchange] = [];
  saveState();
}

function handleSend() {
  const input = $('chat-input');
  const val = (input.value || '').trim();
  if (!val) return;
  if (!pendingSubmitHandler) return;

  input.value = '';
  const h = pendingSubmitHandler;
  pendingSubmitHandler = null;
  h(val);
}

function placeholderForExchange(n) {
  if (n === 1) return 'Describe your role…';
  if (n === 2) return 'Or describe it in your own words…';
  if (n === 3) return "If you've asked before, tell me what happened…";
  return 'Type your answer…';
}

$('send-btn').addEventListener('click', handleSend);
$('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

/* ── Kick off ──────────────────────────────────────────── */
init().catch(err => {
  console.error('init failed:', err);
  stopThinkingAnimation();
  showErrorBubble("Something went wrong loading your session. Refresh to try again.", null);
});
