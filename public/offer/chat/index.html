    if (filled) {
      var col = getBlockColors(b.strength);
      doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
      var textLines = wrapText(insight, blockW - padX * 2 - 2);
      var blockH = forceH || (12 + textLines.length * 4.2 + padY);
      doc.setFillColor(col.bg[0], col.bg[1], col.bg[2]);
      doc.setDrawColor(col.border[0], col.border[1], col.border[2]);
      doc.roundedRect(x, y, blockW, blockH, 2, 2, 'FD');
      doc.setFontSize(7); doc.setFont('helvetica', 'bold');
      doc.setTextColor(col.text[0], col.text[1], col.text[2]);
      doc.text(label.toUpperCase(), x + padX, y + 6.5);
      if (col.badge) {
        var bw = doc.getTextWidth(col.badge) + 4;
        doc.setFillColor(col.border[0], col.border[1], col.border[2]);
        doc.roundedRect(x + blockW - 4 - bw - 1, y + 2.5, bw + 2, 5, 1, 1, 'F');
        doc.setFontSize(6); doc.setTextColor(255, 255, 255);
        doc.text(col.badge, x + blockW - 4 - bw / 2, y + 5.8, { align: 'center' });
      }
      doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
      doc.setTextColor(col.text[0], col.text[1], col.text[2]);
      textLines.forEach(function(line, i) { doc.text(line, x + padX, y + 12 + i * 4.2); });
      return blockH + 2;
    } else {
      var blockH = forceH || 14;
      doc.setFillColor(240, 241, 245); doc.setDrawColor(200, 205, 215);
      doc.roundedRect(x, y, blockW, blockH, 2, 2, 'FD');
      doc.setFontSize(7); doc.setFont('helvetica', 'bold'); doc.setTextColor(160, 165, 180);
      doc.text(label.toUpperCase(), x + padX, y + 6.5);
      doc.setFontSize(6.5); doc.setFont('helvetica', 'italic'); doc.setTextColor(180, 185, 195);
      doc.text(emptyText, x + padX, y + 12);
      return blockH + 2;
    }
  }

  function calcRowH(blocks, colW) {
    var maxH = 14;
    blocks.forEach(function(block) {
      var b = discCanvasBlocks[block];
      if (b && b.filled) {
        doc.setFontSize(7.5);
        var lines = wrapText(b.insight || '', colW - 10);
        var h = 12 + lines.length * 4.2 + 6;
        if (h > maxH) maxH = h;
      }
    });
    return maxH;
  }

  function drawRow(blocks, labels, section) {
    var colW = (W - mx * 2 - (blocks.length - 1) * 3) / blocks.length;
    var rowH = calcRowH(blocks, colW);
    if (y + rowH > H - 20) { drawFooter(); doc.addPage(); y = 16; }
    var savedY = y;
    blocks.forEach(function(block, i) {
      y = savedY;
      drawBlock(block, labels[i], mx + i * (colW + 3), colW, rowH, section);
    });
    y = savedY + rowH + 2;
  }

  function drawFullWidth(block, label, section) {
    var fullW = W - mx * 2;
    var b = discCanvasBlocks[block];
    var estH = 14;
    if (b && b.filled) {
      doc.setFontSize(7.5);
      var lines = wrapText(b.insight || '', fullW - 10);
      estH = 12 + lines.length * 4.2 + 6;
    }
    if (y + estH > H - 20) { drawFooter(); doc.addPage(); y = 16; }
    y += drawBlock(block, label, mx, fullW, null, section);
  }

  function drawFooter() {
    doc.setFillColor(purple[0], purple[1], purple[2]);
    doc.rect(0, H - 12, W, 12, 'F');
    doc.setFontSize(7); doc.setFont('helvetica', 'normal');
    doc.setTextColor(200, 190, 230);
    doc.text('salary.recomlinked.com/offer', mx, H - 5);
    doc.setTextColor(gold[0], gold[1], gold[2]);
    doc.text(isPaid ? 'Full Counter Kit' : 'Free preview - unlock at salary.recomlinked.com/offer', W - mx, H - 5, { align: 'right' });
  }

  // ── YOUR NEGOTIATION ROOM ──
  if (v && v.room_low) {
    if (y + 38 > H - 20) { drawFooter(); doc.addPage(); y = 16; }
    doc.setFillColor(44, 32, 80); doc.setDrawColor(gold[0], gold[1], gold[2]);
    doc.roundedRect(mx, y, W - mx * 2, 36, 3, 3, 'FD');
    doc.setFontSize(7.5); doc.setFont('helvetica', 'bold'); doc.setTextColor(gold[0], gold[1], gold[2]);
    doc.text('YOUR NEGOTIATION ROOM', mx + 5, y + 6);
    doc.setFontSize(14); doc.setFont('helvetica', 'bold'); doc.setTextColor(gold[0], gold[1], gold[2]);
    doc.text(fm(v.room_low) + ' - ' + fm(v.room_high), mx + 5, y + 14);
    var rk = v.risk || 'balanced';
    var tiers = [{l:'SAFE',v:v.counter_safe},{l:'MODERATE',v:v.counter_moderate},{l:'AMBITIOUS',v:v.counter_ambitious}];
    var recIdx = rk==='safe'?0:rk==='ambitious'?2:1;
    var tw = (W - mx * 2 - 12) / 3;
    tiers.forEach(function(t, i) {
      var tx = mx + 5 + i * (tw + 1);
      var isRec = i === recIdx;
      if (isRec) { doc.setFillColor(gold[0],gold[1],gold[2]); doc.setDrawColor(gold[0],gold[1],gold[2]); }
      else        { doc.setFillColor(70,55,110); doc.setDrawColor(90,75,130); }
      doc.roundedRect(tx, y + 18, tw, 11, 1.5, 1.5, 'FD');
      doc.setFontSize(6); doc.setFont('helvetica', 'bold');
      doc.setTextColor(isRec ? 44 : 200, isRec ? 32 : 185, isRec ? 80 : 230);
      doc.text(t.l + (isRec ? ' (PICK)' : ''), tx + tw / 2, y + 22.5, { align: 'center' });
      doc.setFontSize(8); doc.setFont('helvetica', 'bold');
      doc.setTextColor(isRec ? 44 : 240, isRec ? 32 : 235, isRec ? 80 : 255);
      doc.text(fm(t.v), tx + tw / 2, y + 27.5, { align: 'center' });
    });
    doc.setFontSize(6); doc.setFont('helvetica', 'normal'); doc.setTextColor(190, 180, 220);
    doc.text('Risk choice: ' + rk.charAt(0).toUpperCase() + rk.slice(1), mx + 5, y + 33.5);
    y += 40;
  }

  // ── YOUR POSITION ──
  doc.setDrawColor(220, 225, 235); doc.line(mx, y, W - mx, y); y += 5;
  drawSectionTitle('Your Position');
  drawRow(['walkaway', 'risk_tol'], ['Walk-Away Power', 'Risk Tolerance'], 'position');
  drawRow(['urgency', 'talent'], ['Their Urgency', 'Talent Market'], 'position');
  drawFullWidth('offer', 'Offer Structure', 'position');

  // ── OVERALL POSITION SUMMARY ──
  try {
    if (typeof calculateNegotiationScore === 'function' && typeof getNegotiationLabel === 'function') {
      var nScore = calculateNegotiationScore();
      var nLabel = getNegotiationLabel(nScore, (SIM_STATE.context && SIM_STATE.context.risk) || 'balanced');
      if (nLabel) {
        var sumW = W - mx * 2;
        var padX = 5;
        // Pre-measure to size the box
        doc.setFontSize(8.5); doc.setFont('helvetica', 'normal');
        var tgtLines = nLabel.target ? wrapText('Your target: ' + nLabel.target, sumW - padX * 2) : [];
        var rlLines  = nLabel.riskLevel ? wrapText('Risk level: ' + nLabel.riskLevel, sumW - padX * 2) : [];
        var sumH = 13 + tgtLines.length * 4 + 2 + rlLines.length * 4 + 6;
        if (y + sumH > H - 20) { drawFooter(); doc.addPage(); y = 16; }
        doc.setFillColor(244, 246, 250); doc.setDrawColor(30, 61, 114);
        doc.roundedRect(mx, y, sumW, sumH, 2, 2, 'FD');
        doc.setFontSize(7); doc.setFont('helvetica', 'bold'); doc.setTextColor(30, 61, 114);
        doc.text('OVERALL POSITION', mx + padX, y + 6.5);
        doc.setFontSize(9.5); doc.setFont('helvetica', 'bold'); doc.setTextColor(26, 53, 96);
        doc.text((nLabel.label || '').replace(/\u2014/g, '-'), mx + padX, y + 12);
        var ly = y + 17;
        doc.setFontSize(8); doc.setFont('helvetica', 'normal'); doc.setTextColor(60, 70, 95);
        tgtLines.forEach(function(ln) { doc.text(ln, mx + padX, ly); ly += 4; });
        if (tgtLines.length) ly += 1.5;
        rlLines.forEach(function(ln) { doc.text(ln, mx + padX, ly); ly += 4; });
        y += sumH + 2;
      }
    }
  } catch (e) {}

  y += 2; doc.setDrawColor(220, 225, 235); doc.line(mx, y, W - mx, y); y += 5;

  // ── YOUR STRATEGY ──
  drawSectionTitle('Your Strategy');
  drawFullWidth('leverage_risk', 'Leverage & Risk', 'strategy');
  drawFullWidth('emphasize', 'Ask Stack', 'strategy');

  y += 2; doc.setDrawColor(220, 225, 235); doc.line(mx, y, W - mx, y); y += 5;

  // ── YOUR COUNTER KIT ──
  drawSectionTitle('Your Counter Kit');
  drawFullWidth('meeting_email', 'Counter Email', 'plan');
  drawFullWidth('opening_script', 'Phone Opener', 'plan');
  drawFullWidth('levers', 'Non-Salary Levers', 'plan');
  drawFullWidth('pushback', 'Pushback Playbook', 'plan');
  drawFullWidth('fallback', 'Fallback Responses', 'plan');
  drawFullWidth('raise_case', 'Sequencing Plan', 'plan');

  // ── Disclaimer ──
  y += 4;
  if (y + 14 > H - 20) { drawFooter(); doc.addPage(); y = 16; }
  doc.setFontSize(6); doc.setFont('helvetica', 'italic'); doc.setTextColor(160, 150, 180);
  var disc = doc.splitTextToSize('Your Counter Kit is built from the information you provided. Numbers are personalized estimates - a strong starting point, not a guarantee. Your judgment and context always lead.', W - mx * 2);
  doc.text(disc, mx, y); y += disc.length * 3.5 + 4;

  drawFooter();
  doc.save('offer-counter-kit.pdf');
  } catch(e) {
    console.error('PDF error:', e);
    _generatePDFPrintFallback();
  }
}

function calculateNegotiationScore() {
  var wa = discDims.walkaway || 0;
  var rt = discDims.risk_tol || 0;
  var u = discDims.urgency || 0;
  var t = discDims.talent || 0;
  var o = discDims.offer || 0;

  // Step 1: Weighted base — walk-away power matters most
  var base = (wa * 0.30) + (rt * 0.10) + (u * 0.25) + (t * 0.20) + (o * 0.15);

  // Step 2: Weak penalty (dims < 40)
  var weakCount = [wa,u,t,o].filter(function(d) { return d < 40; }).length;
  var weakPenalty = weakCount === 0 ? 0 : weakCount === 1 ? -5 : weakCount === 2 ? -8 : -10;

  // Step 3: Strength bonus (dims >= 70)
  var strongCount = [wa,u,t,o].filter(function(d) { return d >= 70; }).length;
  var strongBonus = strongCount <= 1 ? 0 : strongCount === 2 ? 3 : strongCount === 3 ? 5 : 8;

  // Step 4: Critical combos
  var comboBonus = 0;
  if (wa >= 70 && u >= 60) comboBonus += 4;  // can walk + they're urgent = command position
  if (wa < 40 && u < 40) comboBonus -= 6;   // weak fallback + no urgency = careful
  if (wa >= 70 && t >= 70) comboBonus += 3; // walk-away power + scarce profile

  // Step 5: Clamp
  var final = Math.max(10, Math.min(95, base + weakPenalty + strongBonus + comboBonus));
  return Math.round(final);
}

function getNegotiationLabel(score, riskChoice) {
  // riskChoice: 'safe' | 'balanced' | 'ambitious' (the user's stated approach)
  // The starred tier in the verdict card follows riskChoice exactly.
  // This recommendation NAMES that same tier, then notes if leverage suggests adjusting.
  var choice = riskChoice || 'balanced';
  var chosenTier = choice === 'safe' ? 'safe' : choice === 'ambitious' ? 'ambitious' : 'moderate';
  var tierName = chosenTier === 'safe' ? 'safe' : chosenTier === 'ambitious' ? 'ambitious' : 'moderate';

  // Score buckets define how much leverage they actually have
  var bucket = score >= 72 ? 4 : score >= 55 ? 3 : score >= 40 ? 2 : score >= 25 ? 1 : 0;
  // Tier rank: safe=0, moderate=1, ambitious=2 — used to compare choice vs leverage
  var choiceRank = chosenTier === 'safe' ? 0 : chosenTier === 'ambitious' ? 2 : 1;
  // What leverage alone would suggest
  var leverageRank = bucket >= 4 ? 2 : bucket >= 3 ? 1 : 0;

  // Build the target line — confirms the chosen tier, adds an honest note
  var target;
  if (choiceRank < leverageRank) {
    // Their leverage could support a bolder ask than they chose
    target = 'Your leverage could carry one tier bolder than the ' + tierName + ' counter you picked.';
  } else if (chosenTier === 'ambitious' && bucket <= 1) {
    // Ambitious on a weak (Lean/Difficult) position — honest stretch warning
    target = 'The ambitious counter you chose runs ahead of this position — it needs tightening so it doesn\u2019t overplay.';
  } else if (choiceRank > leverageRank) {
    // They chose bolder than leverage comfortably supports — keep it clean, not scary
    target = 'The ' + tierName + ' counter you chose runs slightly ahead of your leverage — workable if it stays clean.';
  } else {
    // Aligned
    target = 'The ' + tierName + ' counter fits both your leverage and your approach.';
  }

  if (bucket === 4) return { label: 'Strong hand \u2014 but the room only counts if you claim it', riskLevel: 'Low on rescind, high on under-capturing \u2014 the money slips away from accepting too fast or over-explaining, not from countering. Your kit has the exact ask and when to stop talking.', color: '#0a5c3a', bg: '#E8F7F0', border: 'rgba(26,158,108,0.2)', target: target, risk: 'Over-explaining your ask or showing urgency. One number, sign-this-week framing, then stop talking.' };
  if (bucket === 3) return { label: 'Solid position \u2014 there\u2019s room here worth protecting', riskLevel: 'Moderate-low. The danger isn\u2019t a pulled offer \u2014 it\u2019s a weak ask or folding on the first pushback. Your kit has the exact number, framing, and sign-this-week close.', color: '#3d6b1e', bg: '#EEF6E8', border: 'rgba(80,140,40,0.2)', target: target, risk: 'Accepting the first pushback as final. \u2018Best and final\u2019 on the first mention almost never is.' };
  if (bucket === 2) return { label: 'Viable \u2014 tone and framing matter most', riskLevel: 'Moderate. One clean ask, warm framing, no range or apology \u2014 and hold the extras until base is settled. Your kit has the wording.', color: '#6a4a10', bg: '#FDF5E6', border: 'rgba(201,168,76,0.2)', target: target, risk: 'Giving a range instead of one number, or apologising for countering. Neither signals the confidence that gets yeses.' };
  if (bucket === 1) return { label: 'Lean position \u2014 every word counts', riskLevel: 'Moderate-high. Keep it tight and warm \u2014 one ask, and pivot to a signing bonus the moment base is blocked. Your kit has that pivot scripted.', color: '#b45a00', bg: '#FFF4E6', border: 'rgba(200,120,20,0.2)', target: target, risk: 'Revealing urgency, asking for too much, or countering without a sign-this-week signal. The pushback playbook is your most important section.' };
  return { label: 'Difficult position \u2014 preparation is everything', riskLevel: 'High. A minimal, enthusiastic counter only \u2014 base, one ask, close fast. Your kit keeps it simple and gets the number in writing.', color: '#7a2020', bg: '#FCEBEB', border: 'rgba(204,68,68,0.2)', target: 'A minimal, enthusiastic counter \u2014 base only, one ask, no extras.', risk: 'Over-reaching with a big counter or negotiating multiple items at once. Keep it simple and close fast.' };
}

function initDiscoveryMode(container) {
  // Set stable offer session ID — separate from sim_session_id which gets overwritten
  if (!state.offer_session_id) {
    state.offer_session_id = 'offer_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    saveState();
  }
  logSession('disc_start', { stage: 'disc_start', product: 'offer' });

  // Track drop-offs — fires when user leaves before completing intake
  window._offerDropHandler = function() {
    var step = (typeof discStep !== 'undefined') ? discStep : 0;
    var total = (typeof DISC_FREE_QUESTIONS !== 'undefined') ? DISC_FREE_QUESTIONS : 16;
    if (step > 0 && step < total) {
      var lastQ = discOrderedQuestions && discOrderedQuestions[step - 1] ? discOrderedQuestions[step - 1].id : '';
      var role = (SIM_STATE && SIM_STATE.context && SIM_STATE.context.role) ? SIM_STATE.context.role : '';
      navigator.sendBeacon(API_LOG, JSON.stringify({
        event: 'RAISE_SESSION',
        product: 'offer',
        session_id: profileHash(),
        user_id: USER_ID,
        stage: 'offer_dropped',
        last_question: lastQ,
        questions_answered: step,
        role: role,
        blocker_code: (SIM_STATE && SIM_STATE.blocker) ? SIM_STATE.blocker : '',
        duration_s: Math.round((Date.now() - SESSION_START_TIME) / 1000),
        source: window.location.href,
        timestamp: new Date().toISOString(),
      }));
    }
  };
  // Remove any previous listener before adding new one
  window.removeEventListener('beforeunload', window._offerDropHandler);
  window.addEventListener('beforeunload', window._offerDropHandler);
  container.innerHTML = '';

  // Restore discovery state from localStorage if available
  try {
    var saved = state.discovery;
    if (saved && saved.step > 0) {
      discDims = saved.dims || discDims;
      discActive = saved.active || discActive;
      discLevers = saved.levers || discLevers;
      discWeaks = saved.weaks || discWeaks;
      discStep = saved.step || 0;
      discInsights = saved.insights || {};
      if (saved.canvasBlocks) discCanvasBlocks = saved.canvasBlocks;
      // Restore SIM_STATE.context from saved answers so buildOfferCtx()
      // has the user's role, base, city etc. when generating the full kit
      if (saved.answers) {
        Object.keys(saved.answers).forEach(function(k) {
          SIM_STATE.context[k] = saved.answers[k];
        });
      }

      // Force teaser on strategy/plan blocks for free users
      if (!state.paid) {
        ['leverage_risk','emphasize','levers','opening_script','pushback','fallback','meeting_email','raise_case'].forEach(function(k) {
          if (discCanvasBlocks[k] && discCanvasBlocks[k].filled) {
            discCanvasBlocks[k].teaser = true;
          }
        });
        // Restore collapsed state if strategy was previously generated
        var hasStrategy = ['leverage_risk','emphasize','levers','opening_script','pushback','fallback','meeting_email','raise_case'].some(function(k) {
          return discCanvasBlocks[k] && discCanvasBlocks[k].filled;
        });
        if (hasStrategy) discStrategyDone = true;
      }
    }
  } catch (e) {}

  // Build questions based on blocker
  var blockerCode = SIM_STATE.context.blocker_code || (SIM_STATE.blocker ? SIM_STATE.blocker.code : 'other');
  discOrderedQuestions = buildDiscQuestions(blockerCode);

  if (state.paid && discStep === 0 && state.paid_token) {

          if (rCtx.dims) { discDims = Object.assign(discDims, rCtx.dims); }
          if (rCtx.levers) discLevers = rCtx.levers;
          if (rCtx.weaks) discWeaks = rCtx.weaks;
          if (!state.discovery) state.discovery = {};

function drawDiscRadarOnCanvas(canvas) {
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = 240, h = 240, cx = 120, cy = 120, r = 65;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(dpr, dpr);

  var labels = ['Walk-Away Power','Risk Tolerance','Their Urgency','Talent Market','Offer Structure'];
  var keys = ['walkaway','risk_tol','urgency','talent','offer'];
  var activeColor = 'rgba(30,61,114,0.85)';
  var inactiveColor = 'rgba(128,128,128,0.3)';
  var n = labels.length; // 4

  for (var ring = 3; ring >= 1; ring--) {
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (Math.PI * 2 * (i % n) / n) - Math.PI / 2;
      var rr = r * ring / 3;
      if (i === 0) ctx.moveTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a));
      else ctx.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a));
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(128,128,128,0.12)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  for (var i = 0; i < n; i++) {
    var a = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.strokeStyle = 'rgba(128,128,128,0.12)'; ctx.lineWidth = 0.5; ctx.stroke();

    var lx = cx + (r + 16) * Math.cos(a);
    var ly = cy + (r + 16) * Math.sin(a);
    ctx.fillStyle = discActive[keys[i]] ? activeColor : inactiveColor;
    ctx.font = (discActive[keys[i]] ? '600 ' : '400 ') + '11px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
  }

  var activeCount = keys.filter(function(k) { return discActive[k]; }).length;
  if (activeCount >= 1) {
    // Draw filled polygon — inactive dims plot at center (0) so shape reflects real data
    // Build polygon only from active dims; inactive dims sit at center (cx,cy)
    ctx.beginPath();
    var firstPoint = true;
    for (var i = 0; i <= n; i++) {
      var a = (Math.PI * 2 * (i % n) / n) - Math.PI / 2;
      var k = keys[i % n];
      var v = discActive[k] ? Math.max(0.08, discDims[k] / 100) : 0;
      var x = discActive[k] ? cx + r * v * Math.cos(a) : cx;
      var y = discActive[k] ? cy + r * v * Math.sin(a) : cy;
      if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; } else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(26,158,108,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(26,158,108,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i / n) - Math.PI / 2;
      var v = discActive[keys[i]] ? Math.max(0.08, discDims[keys[i]] / 100) : 0.02;
      ctx.beginPath();
      ctx.arc(cx + r * v * Math.cos(a), cy + r * v * Math.sin(a), 4, 0, Math.PI * 2);
      ctx.fillStyle = !discActive[keys[i]] ? 'rgba(200,200,200,0.3)' : discDims[keys[i]] >= 60 ? '#1a9e6c' : discDims[keys[i]] >= 40 ? '#c9a84c' : '#E05555';
      ctx.fill();
    }
  }

  ctx.restore();
}


// Animate radar — dots slide along their axis spoke
var _radarAnimFrame = null;
function animateDiscRadar(canvas) {
  if (_radarAnimFrame) { cancelAnimationFrame(_radarAnimFrame); _radarAnimFrame = null; }
  if (!canvas) return;
  var keys = ['walkaway','risk_tol','urgency','talent','offer'];
  var start = null;
  function frame(ts) {
    if (!start) start = ts;
    var c = canvas;
    if (!c || !c.isConnected) { _radarAnimFrame = null; return; }
    drawDiscRadarOnCanvas(c);
    var ctx2 = c.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var cx = 120, cy = 120, r = 65, n = 5;
    ctx2.save();
    ctx2.scale(dpr, dpr);
    for (var i = 0; i < n; i++) {
      if (discActive[keys[i]]) continue;
      var a = (Math.PI * 2 * i / n) - Math.PI / 2;
      // All dots pulse together — same phase, all big then all small
      var t = (ts - start) / 3000; // 3s cycle
      var size = 3 + 1.5 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2));
      var px = cx + r * 0.2 * Math.cos(a);
      var py = cy + r * 0.2 * Math.sin(a);
      ctx2.beginPath();
      ctx2.arc(px, py, size, 0, Math.PI * 2);
      ctx2.fillStyle = 'rgba(201,168,76,0.55)';
      ctx2.fill();
    }
    ctx2.restore();
    _radarAnimFrame = requestAnimationFrame(frame);
  }
  _radarAnimFrame = requestAnimationFrame(frame);
}

function pickDiscInput(qIdx, q, value, skipped) {

  var chatArea = $('disc-chat');
  var isMoney = (q.input === 'money' || q.input === 'money_optional');
  var isTextarea = (q.input === 'textarea_optional');
  // Magnitude fix: for any annual salary field, "90" means "90,000". Only correct when the
  // result lands in a plausible annual range (>=10k); genuinely invalid values are blocked at submit.
  if (isMoney && !skipped) {
    var _n = parseInt(value.replace(/[^\d]/g, ''), 10) || 0;
    if (_n >= 10 && _n < 1000) { value = String(_n * 1000); }
  }
  var displayText = skipped ? (q.skipText || 'Skipped') : (isMoney ? ('$' + Number(String(value).replace(/[^\d]/g,'')||0).toLocaleString('en-US')) : (isTextarea ? 'Job description added \u2713' : value));

}

function replayDiscHistory(chatArea) {
  if (!chatArea) chatArea = $('disc-chat');
  if (!chatArea) return;
  var answers = (state.discovery && state.discovery.answers) ? state.discovery.answers : {};
  var upto = Math.min(discStep, discOrderedQuestions.length);
  for (var i = 0; i < upto; i++) {
    var q = discOrderedQuestions[i];
    if (!q) continue;
    var stored = answers[q.id];
    if (stored === undefined || stored === null) continue; // no recorded answer — skip

    // Question bubble (coach) — same markup as renderDiscQuestion
    var catLabel = q.dimTag ? (DIM_LABELS[q.dimTag] || q.dimTag) : (Q_CATEGORY_LABELS[q.id] || '');
    var labelHtml = catLabel ? '<span class="disc-dim-tag">' + catLabel + '</span> ' : '';
    var coachBubble = el('div', 'coach-msg', '');
    coachBubble.innerHTML = '<div class="bubble"><p>' + labelHtml + q.label + '</p></div>';
    chatArea.appendChild(coachBubble);

    // Reconstruct the user's answer display text
    var displayText;
    var isMoney = (q.input === 'money' || q.input === 'money_optional');
    var isTextarea = (q.input === 'textarea_optional');
    if (stored === 'skipped' || stored === '') {
      displayText = q.skipText || 'Skipped';
    } else if (q.options && q.options.length) {
      // Multiple-choice: map stored value back to its display text
      var opt = null;
      for (var j = 0; j < q.options.length; j++) { if (q.options[j].val === stored) { opt = q.options[j]; break; } }
      displayText = opt ? opt.text : String(stored);
    } else if (isMoney) {
      displayText = '$' + (Number(String(stored).replace(/[^\d]/g, '')) || 0).toLocaleString('en-US');
    } else if (isTextarea) {
      displayText = 'Job description added \u2713';
    } else {
      displayText = String(stored);
    }

    var userBubble = el('div', 'user-msg', '');
    userBubble.innerHTML = '<div class="user-bubble">' + escapeHtml(displayText) + '</div>';
    chatArea.appendChild(userBubble);
  }
}

function renderDiscQuestion(idx) {
  if (idx >= discOrderedQuestions.length || idx >= DISC_FREE_QUESTIONS) { generateDiscInsights(); return; }
  var q = discOrderedQuestions[idx];
  var chatArea = $('disc-chat');
  if (!chatArea) return;

  // Invisible marker — used by back button to find where this step starts
  var _stepMarker = el('div', '', '');
  _stepMarker.dataset.discStepStart = idx;
  _stepMarker.style.display = 'none';
  chatArea.appendChild(_stepMarker);

  // Back button — only shown from Q2 onward, but NOT on the first question after a resume
  // (the undo stack is empty on resume, so the button would do nothing).
  if (idx > 0 && !_discResumeLanding) {
    var _backRow = el('div', '', '');
    _backRow.style.cssText = 'padding:0 2px 4px;';
    _backRow.innerHTML = '<button onclick="goBackDiscQuestion()" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--t3);padding:2px 0;display:flex;align-items:center;gap:4px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>Edit my last answer</button>';
    chatArea.appendChild(_backRow);
  }
  _discResumeLanding = false; // only suppress for the resume-landing question

  var coachBubble = el('div', 'coach-msg', '');
  var catLabel = q.dimTag ? (DIM_LABELS[q.dimTag] || q.dimTag) : (Q_CATEGORY_LABELS[q.id] || '');
  var labelHtml = catLabel ? '<span class="disc-dim-tag">' + catLabel + '</span> ' : '';
  coachBubble.innerHTML = '<div class="bubble"><p>' + labelHtml + q.label + '</p></div>';
  chatArea.appendChild(coachBubble);

  if (q.input) {
    chatArea.appendChild(buildDiscInputUI(idx, q));
  } else {
    var chipsWrap = el('div', 'coach-msg', '');
    var opts = el('div', 'sim-pills-row', '');
    opts.id = 'disc-opts-' + idx;
    opts.style.alignItems = 'flex-start';
    q.options.forEach(function(opt) {
      var pill = el('button', 'sim-reply-pill', '');
      pill.style.flexDirection = 'row';
      pill.style.alignItems = 'center';
      pill.style.gap = '10px';
      var radio = el('div', 'chip-radio', '');
      pill.appendChild(radio);
      var textSpan = el('span', '', '');
      textSpan.style.cssText = 'font-size:12.5px;line-height:1.5;color:var(--t2);flex:1;';
      textSpan.textContent = opt.text;
      pill.appendChild(textSpan);
      pill.onclick = function() { pickDiscAnswer(idx, opt, pill); };
      opts.appendChild(pill);
    });
    chipsWrap.appendChild(opts);
    chatArea.appendChild(chipsWrap);
  }

  // At Q1 only: show empty pulsing radar below chips as a teaser
  if (idx === 0) {
    var teaserMsg = el('div', 'coach-msg disc-radar-msg', '');
    var teaserWrap = el('div', '', '');
    teaserWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;';
    var teaserTitle = el('div','','');
    teaserTitle.style.cssText = 'font-size:11px;font-weight:600;color:var(--t3);text-align:center;margin-bottom:8px;letter-spacing:0.03em;text-transform:uppercase;';
    teaserTitle.textContent = 'Your negotiation leverage';
    teaserWrap.appendChild(teaserTitle);
    var tc = document.createElement('canvas');
    var dpr = window.devicePixelRatio || 1;
    tc.width = 240 * dpr; tc.height = 240 * dpr;
    tc.style.width = '240px'; tc.style.height = '240px';
    tc.className = 'disc-radar-canvas';
    teaserWrap.appendChild(tc);
    teaserMsg.appendChild(teaserWrap);
    chatArea.appendChild(teaserMsg);
    drawDiscRadarOnCanvas(tc);
    animateDiscRadar(tc);
  }

  setTimeout(function() {
    var wrap = $('chat-wrap');
    if (wrap && coachBubble) {
      var target = coachBubble.offsetTop - 10;
      var start = wrap.scrollTop;
      var distance = target - start;
      var duration = 1800;
      var startTime = null;
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        wrap.scrollTop = start + distance * easeInOutCubic(progress);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }, 300);
}

function pickDiscAnswer(qIdx, opt, pill) {
  var opts = $('disc-opts-' + qIdx);
  if (!opts) return;
  
  opts.querySelectorAll('.sim-reply-pill').forEach(function(p) {
    p.disabled = true;
    p.style.opacity = '0.35';
    p.style.pointerEvents = 'none';
    p.classList.remove('active');
  });
  pill.style.opacity = '1';
  pill.classList.add('active');

  var chatArea = $('disc-chat');
  var userBubble = el('div', 'user-msg', '');
  userBubble.innerHTML = '<div class="user-bubble">' + escapeHtml(opt.text) + '</div>';
  chatArea.appendChild(userBubble);

  // Snapshot current state for back button
  _discAnswerHistory.push({
    step: qIdx,
    dims: JSON.parse(JSON.stringify(discDims)),
    active: JSON.parse(JSON.stringify(discActive)),
    levers: discLevers.slice(),
    weaks: discWeaks.slice(),
    context: JSON.parse(JSON.stringify(SIM_STATE.context || {})),
  });

  // Update scores
  var q = discOrderedQuestions[qIdx];
  var primaryDim = q.dimTag;
  Object.keys(opt.scores).forEach(function(k) {
    if (k === primaryDim) {
      // Direct answer: OVERRIDE score (don't Math.max)
      discDims[k] = opt.scores[k];
      discActive[k] = true;
    } else {
      // Cross-dimension hint: only boost if not directly answered yet
      if (!discActive[k]) {
        discDims[k] = Math.max(discDims[k] || 0, opt.scores[k]);
        // Don't set discActive — this dimension hasn't been directly answered
      }
    }
  });
  if (opt.type === 'lever') discLevers.push(opt.note);
  if (opt.type === 'weak') discWeaks.push(opt.note);

  // Update canvas block for this dimension
  SIM_STATE.context[q.id] = opt.val;
  if (q.dimTag && discCanvasBlocks[q.dimTag]) {
    discCanvasBlocks[q.dimTag].filled = true;
    var dimScore = discDims[q.dimTag] || 0;
    discCanvasBlocks[q.dimTag].strength = dimScore >= 60 ? 'strong' : dimScore >= 40 ? 'neutral' : 'weak';
    // Position cards: title + badge only — no chip notes stored
    // Teaser content from API hooks fills these after intake
  }

  // Save to localStorage
  try {
    state.discovery = {
      dims: JSON.parse(JSON.stringify(discDims)),
      active: JSON.parse(JSON.stringify(discActive)),
      levers: discLevers.slice(),
      weaks: discWeaks.slice(),
      step: discStep + 1,
      insights: discInsights,
      canvasBlocks: discCanvasBlocks,
      answers: state.discovery ? state.discovery.answers || {} : {}
    };
    state.discovery.answers[q.id] = opt.val;
    saveState();
  } catch (e) {}

  logEntry('disc_answer', { question: q.id, dimension: q.dimTag, answer: opt.val, note: opt.note, type: opt.type });
  // Log live progress with question ID (not index — city skip makes index unreliable)
  logSession('offer_q_' + q.id, { product:'offer', last_question: q.id, answer: opt.val, questions_answered: discStep });

  // Recompute composite dims after every answer
  (function() {
    var ctx=SIM_STATE.context, emp=ctx.employment||'', risk=ctx.risk||'', comp=ctx.competing||'';
    // ── risk_tol: risk choice alone ──
    var rtScore = risk==='ambitious'?85:risk==='balanced'?65:risk==='safe'?40:0;
    if (risk) {
      discDims.risk_tol=rtScore; discActive.risk_tol=true;
      discCanvasBlocks.risk_tol.filled=true;
      discCanvasBlocks.risk_tol.strength=rtScore>=60?'strong':rtScore>=40?'neutral':'weak';
      discCanvasBlocks.risk_tol.note = '';
      discCanvasBlocks.risk_tol.insight = '';
    }
    var empB=emp==='employed_stable'?90:emp==='employed_leaving'?55:emp==='between_jobs'?30:emp==='first_job'?35:0;
    var compB=comp==='yes'?95:comp==='expecting'?65:comp==='interviewing'?45:comp==='no'?25:0;
    var waPts=[empB,compB].filter(Boolean);
    if (waPts.length) {
      var waScore=Math.round(waPts.reduce(function(a,b){return a+b;},0)/waPts.length);
      discDims.walkaway=waScore; discActive.walkaway=true;
      discCanvasBlocks.walkaway.filled=true;
      discCanvasBlocks.walkaway.strength=waScore>=60?'strong':waScore>=40?'neutral':'weak';
      var waLbl=[{employed_stable:'Can walk away',employed_leaving:'Employed, motivated to move',between_jobs:'Between jobs',first_job:'First offer'}[emp],
                 comp==='yes'?'competing offer in hand':comp==='expecting'?'offer incoming':comp==='interviewing'?'still interviewing':''].filter(Boolean);
      discCanvasBlocks.walkaway.note = '';
    }

    // ── urgency: speed + deadline (average) ──
    var spd=ctx.speed||'', dl=ctx.deadline||'';
    var spdB=spd==='chased'?90:spd==='fast'?70:spd==='normal'?50:spd==='slow'?35:0;
    var dlB=dl==='24_72h'?65:dl==='this_week'?55:dl==='1_2wk'?45:dl==='none'?35:0;
    var urPts=[spdB,dlB].filter(Boolean);
    if (urPts.length) {
      var urScore=Math.round(urPts.reduce(function(a,b){return a+b;},0)/urPts.length);
      discDims.urgency=urScore; discActive.urgency=true;
      discCanvasBlocks.urgency.filled=true;
      discCanvasBlocks.urgency.strength=urScore>=60?'strong':urScore>=40?'neutral':'weak';
      discCanvasBlocks.urgency.note = '';
    }

    // ── offer: anchor + extras + company_size (average, base adds +10 via input path) ──
    var anch=ctx.anchor||'', ext=ctx.extras||'', csz=ctx.company_size||'';
    var anchB=anch==='no_anchor'?75:anch==='matched'?35:anch==='below'?60:anch==='above'?70:0;
    var extB=ext==='signing'?70:ext==='equity'?65:ext==='signing_equity'?80:ext==='base_only'?45:0;
    var cszB=csz==='cs_1_50'?65:csz==='cs_51_200'?60:csz==='cs_201_1k'?55:csz==='cs_1k_5k'?50:csz==='cs_5k_plus'?45:0;
    var ofPts=[anchB,extB,cszB].filter(Boolean);
    if (ofPts.length) {
      var ofScore=Math.round(ofPts.reduce(function(a,b){return a+b;},0)/ofPts.length);
      // Base salary adds +10 if entered
      if (ctx.base) ofScore = Math.min(95, ofScore + 10);
      discDims.offer=ofScore; discActive.offer=true;
      discCanvasBlocks.offer.filled=true;
      discCanvasBlocks.offer.strength=ofScore>=60?'strong':ofScore>=40?'neutral':'weak';
      discCanvasBlocks.offer.note = '';
    }

    // ── talent: worktype + experience (average) + research nudge ──
    var wt=ctx.worktype||'', xp=ctx.experience||'';
    var wtB=wt==='on_site'?70:wt==='hybrid'?55:wt==='remote'?40:0;
    var xpB=xp==='under2'?35:xp==='2_5'?55:xp==='5_10'?70:xp==='over10'?85:0;
    var taPts=[wtB,xpB].filter(Boolean);
    if (taPts.length) {
      var taScore=Math.round(taPts.reduce(function(a,b){return a+b;},0)/taPts.length);
      // Research nudge
      var rm = parseFloat(ctx.researched_max);
      var base = parseFloat(String(ctx.base||'0').replace(/,/g,''));
      if (rm && base && rm > base) {
        var gap = (rm - base) / base;
        taScore = Math.min(95, taScore + (gap > 0.15 ? 18 : 12));
      }
      discDims.talent=taScore; discActive.talent=true;
      discCanvasBlocks.talent.filled=true;
      discCanvasBlocks.talent.strength=taScore>=60?'strong':taScore>=40?'neutral':'weak';
      discCanvasBlocks.talent.note = '';
      discCanvasBlocks.talent.insight = '';
    }
  })();

  if (_radarAnimFrame) { cancelAnimationFrame(_radarAnimFrame); _radarAnimFrame = null; }
  insertDiscRadar();

  // Reaction line — typed in like a coach reply, next question waits
  // Delay so radar settles first, then reaction types in
  var _reactionDone = opt.note ? new Promise(function(res) {
    setTimeout(function() { typeReaction(opt.note, chatArea).then(res); }, 500);
  }) : Promise.resolve();

  // Smooth scroll to user's answer
  setTimeout(function() {
    var chatWrap = $('chat-wrap');
    if (chatWrap && userBubble) {
      var target = userBubble.offsetTop - 20;
      var start = chatWrap.scrollTop;
      var distance = target - start;
      var duration = 1500;
      var startTime = null;
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        chatWrap.scrollTop = start + distance * easeOut(progress);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }, 200);
  
  discStep++;
  _reactionDone.then(function() {
    setTimeout(function() {
      renderDiscQuestion(discStep);
    }, 400);
  });
}

function goBackDiscQuestion() {

  renderDiscQuestion(snap.step);
}

// ██  OFFER VERDICT — deterministic, computed client-side  ██

function computeOfferVerdict() {
  var ctx = SIM_STATE.context || {};
  // Fallback: use saved discovery answers if SIM_STATE.context is empty (paid restore path)
  if (!ctx.base && state && state.discovery && state.discovery.answers) {
    var ans = state.discovery.answers;
    Object.keys(ans).forEach(function(k) { if (!ctx[k]) ctx[k] = ans[k]; });
  }
  var base = parseInt(String(ctx.base || '').replace(/[^\d]/g, ''), 10) || 0;
  // Magnitude normalization safety net: "85" -> 85,000. Only correct when plausible (>=10).
  if (base >= 10 && base < 1000) { base = base * 1000; ctx.base = String(base); }
  if (!base || base < 10000) return null;
  var lo = 0.06, hi = 0.10;
  if (ctx.competing === 'yes') { lo += 0.02; hi += 0.04; }
  else if (ctx.competing === 'expecting') { lo += 0.01; hi += 0.02; }
  else if (ctx.competing === 'interviewing') { hi += 0.01; }
  if (ctx.speed === 'chased') { lo += 0.01; hi += 0.02; }
  else if (ctx.speed === 'fast') { hi += 0.01; }
  if (ctx.deadline === 'under_24h' || ctx.deadline === '24_72h' || ctx.deadline === 'this_week') { hi += 0.005; }
  if (ctx.extras === 'base_only') { hi += 0.005; }
  if (ctx.worktype === 'on_site') { hi += 0.01; }
  else if (ctx.worktype === 'hybrid') { hi += 0.005; }
  if (ctx.employment === 'employed_stable') { lo += 0.005; hi += 0.01; }
  else if (ctx.employment === 'between_jobs') { hi = Math.max(0.06, hi - 0.01); }
  else if (ctx.employment === 'first_job') { hi = Math.max(0.06, hi - 0.005); }
  var _ind = String(ctx.industry || '').toLowerCase();
  if (/gov|public|school|universit|educat|health|hospital|medic|nurs/.test(_ind)) { hi = Math.max(0.06, hi - 0.01); }
  else if (/tech|software|startup|saas|fintech|ai\b/.test(_ind)) { hi += 0.005; }
  if (ctx.company_size === 'cs_5k_plus' || ctx.company_size === 'cs_1k_5k') { hi = Math.max(0.06, hi - 0.005); }
  if (ctx.experience === 'over10') { hi += 0.005; }
  else if (ctx.experience === '5_10') { hi += 0.0025; }
  var roomLow = base * lo, roomHigh = base * hi;
  // Posted salary band — the employer's own stated ceiling for this role. Strongest anchor.
  var postedMax = parseInt(String(ctx.posted_max || '').replace(/[^\d]/g, ''), 10) || 0;
  if (postedMax >= 10 && postedMax < 1000) postedMax = postedMax * 1000; // "90" -> 90,000
  if (postedMax > base) {
    var pgap = postedMax - base;
    var pcap = Math.min(pgap, base * 0.25);   // posted band can push room up to 25% of base
    roomHigh = Math.max(roomHigh, Math.min(pcap, pgap * 0.85));
  }
  var researchedMax = parseInt(String(ctx.researched_max || '').replace(/[^\d]/g, ''), 10) || 0;
  if (researchedMax >= 10 && researchedMax < 1000) researchedMax = researchedMax * 1000; // "90" -> 90,000
  if (researchedMax > base) {
    var cap = Math.min(researchedMax - base, base * 0.18);
    roomHigh = Math.max(roomHigh, Math.min(cap, roomHigh * 1.4));
  }
  roomLow = Math.min(roomLow, roomHigh * 0.7);
  function r500(v) { return Math.max(500, Math.round(v / 500) * 500); }
  roomLow = r500(roomLow);
  roomHigh = Math.max(roomLow + 500, r500(roomHigh));
  var counter = r500(base + roomHigh * 0.9);
  var counterSafe = r500(base + roomLow);
  var counterModerate = r500(base + roomHigh * 0.85);
  if (counterModerate <= counterSafe) counterModerate = counterSafe + 500;
  var counterAmbitious = r500(base + roomHigh * 1.05);
  if (counterAmbitious <= counterModerate) counterAmbitious = counterModerate + 500;
  var riskPref = ctx.risk || 'balanced';
  var recommended = riskPref === 'safe' ? counterSafe : riskPref === 'ambitious' ? counterAmbitious : counterModerate;
  var lev = 'The offer structure itself \u2014 first numbers sit below the approved band';
  if (ctx.competing === 'yes') lev = 'Your competing offer \u2014 the strongest card in any negotiation';
  else if (postedMax > base) lev = 'The posted salary range \u2014 they\u2019ve stated they\u2019ll pay up to $' + postedMax.toLocaleString('en-US') + ', and your offer sits below it';
  else if (ctx.employment === 'employed_stable') lev = 'You don\u2019t need this job \u2014 the strongest position any negotiator can hold';
  else if (ctx.speed === 'chased') lev = 'Their speed \u2014 they chased you, and hiring urgency is leverage';
  else if (ctx.speed === 'fast') lev = 'Their fast process \u2014 urgency on their side is leverage on yours';
  else if (researchedMax > base) lev = 'Your market research \u2014 you counter with data, not hope';
  else if (ctx.deadline === 'under_24h' || ctx.deadline === '24_72h' || ctx.deadline === 'this_week') lev = 'Their tight deadline \u2014 pressure to close cuts both ways';
  else if (ctx.worktype === 'on_site') lev = 'The on-site requirement \u2014 a smaller local talent pool is leverage for those in it';
  return { base: base, roomLow: roomLow, roomHigh: roomHigh, counter: counter, counterSafe: counterSafe, counterModerate: counterModerate, counterAmbitious: counterAmbitious, risk: riskPref, recommended: recommended, leverage: lev };
}

function buildOfferCtx() {
  var ctx = SIM_STATE.context || {};
  var v = (state && state.offer_verdict) || computeOfferVerdict() || {};
  return {
    role: ctx.role || '',
    base: ctx.base || '',
    deadline: ctx.deadline || '',
    competing: ctx.competing || '',
    speed: ctx.speed || '',
    extras: ctx.extras || '',

    employment: ctx.employment || '',

    city: ctx.city || '',
    company_size: ctx.company_size || '',
    anchor: ctx.anchor || '',
    tone: (ctx.risk === 'safe' || ctx.employment === 'between_jobs') ? 'formal' : (ctx.risk === 'ambitious' && ctx.employment === 'employed_stable') ? 'direct' : 'warm',
    risk: ctx.risk || 'balanced',

  };
}

  setTimeout(function() {

    var userMsgs = chatArea.querySelectorAll('.user-msg');
    var lastAnswer = userMsgs.length > 0 ? userMsgs[userMsgs.length - 1] : null;
    if (!lastAnswer) { chatWrap.scrollTop = chatWrap.scrollHeight; return; }

    // Step 1: Jump to user's answer
    chatWrap.scrollTop = lastAnswer.offsetTop - 20;

    // Step 2: Smooth scroll to bottom of consent question over 2 seconds
    setTimeout(function() {
      var start = chatWrap.scrollTop;
      var consent = document.getElementById('tailor-consent-chips');
      var target = consent
        ? consent.offsetTop + consent.offsetHeight + 16
        : chatWrap.scrollHeight - chatWrap.clientHeight;
      var distance = target - start;
      var duration = 2000;
      var startTime = null;
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

        var progress = Math.min((ts - startTime) / duration, 1);

      }
      requestAnimationFrame(step);
    }, 800);

function highlightPlanCards(keys) {

function highlightPlanCardsIn(container, keys) {
  keys.forEach(function(key) {

    if (!card) return;
    card.classList.add('plan-tailored', 'plan-tailored-animate');

      var w = $('chat-wrap');
      if (!w) return;
      var start = w.scrollTop;
      var target = w.scrollHeight - w.clientHeight;
      var distance = target - start;
      var duration = 2000;
      var startTime = null;
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        w.scrollTop = start + distance * easeInOutCubic(progress);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, 600);

    var radio = el('div', 'chip-radio', '');

    var textSpan = el('span', '', '');

        p.style.pointerEvents = 'none';

      pill.classList.add('active');

      // User bubble
      var userWrap = el('div', 'user-msg', '');
      userWrap.innerHTML = '<div class="user-bubble">' + chip.text + '</div>';

      // Store answer
      tailorAnswers[q.id] = chip.val;

      // Highlight cards

      // Scroll to user bubble (same as pickDiscAnswer)
      setTimeout(function() {
        var chatWrap = $('chat-wrap');

          var target = userWrap.offsetTop - 20;
          var start = chatWrap.scrollTop;
          var distance = target - start;
          var duration = 1500;
          var startTime = null;
          function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
          function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            chatWrap.scrollTop = start + distance * easeOut(progress);
            if (progress < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }
      }, 200);

      // Next question after pause — faster than original 5 questions
      setTimeout(function() {
        showTailorQuestion(chatArea, idx + 1);
      }, 800);
    };
    opts.appendChild(pill);
  });
  chipsWrap.appendChild(opts);

  // Smooth scroll to question bubble — same as renderDiscQuestion (1800ms, easeInOutCubic, 300ms delay)

        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }, 300);
}

function renderOpeningChips() {
  const blocker = SIM_STATE.blocker;
  const openings = BLOCKER_OPENINGS[blocker.code] || BLOCKER_OPENINGS.other;
  const INITIAL_SHOW = 3;

  const wrap = el('div', 'coach-msg', '');
  const inner = el('div', '', '');
  const row = el('div', 'sim-pills-row', '');
  row.style.alignItems = 'flex-start';
  inner.appendChild(row);

  const hiddenPills = [];

  openings.forEach((opener, i) => {
    const pill = el('button', 'sim-reply-pill', '');
    pill.style.flexDirection = 'row';
    pill.style.alignItems = 'flex-start';
    pill.style.gap = '10px';

    // Radio circle (pick-one indicator)
    const radio = el('div', 'chip-radio', '');
    pill.appendChild(radio);

    // Rank number
    const rank = el('div', 'chip-rank', `#${i + 1}`);
    pill.appendChild(rank);

    // Show actual opening text — always truncated to create curiosity
    const textSpan = el('span', '', '');
    textSpan.style.flex = '1';
    textSpan.style.fontSize = '12.5px';
    textSpan.style.lineHeight = '1.5';
    textSpan.style.color = 'var(--t1)';
    textSpan.style.fontWeight = '400';
    const clean = opener.text.replace(/^["'\u201c]+|["'\u201d]+$/g, '');
    textSpan.textContent = '\u201c' + clean.slice(0, 75) + '...\u201d';
    pill.appendChild(textSpan);

    pill.onclick = () => pickOpening(opener, pill, row);

    if (i < INITIAL_SHOW) {
      row.appendChild(pill);
    } else {
      pill.style.display = 'none';
      row.appendChild(pill);
      hiddenPills.push(pill);
    }
  });

  // Custom "I'd say something else" pill — hidden inside more options
  const custom = el('button', 'sim-pill sim-pill-custom', '');
  custom.textContent = "+ I'd say something else\u2026";
  custom.style.display = 'none';
  custom.onclick = () => {
    const inputEl = $('chat-input');
    if (inputEl) inputEl.focus();
  };
  row.appendChild(custom);
  hiddenPills.push(custom);

  // Expand/collapse toggle
  if (hiddenPills.length > 0) {
    const toggle = el('button', 'chips-expand', '');
    toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg> ' + hiddenPills.length + ' more options';
    let expanded = false;
    toggle.onclick = () => {
      expanded = !expanded;
      hiddenPills.forEach(p => { p.style.display = expanded ? '' : 'none'; });
      if (expanded) {
        toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg> Show less';
      } else {
        toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg> ' + hiddenPills.length + ' more options';
      }
    };
    inner.appendChild(toggle);
  }

  wrap.appendChild(inner);
  $('messages').appendChild(wrap);
  simBranchAnchor = wrap;

  // Start over link — lets paid users try a different scenario
  if (state.paid) {
    const restartWrap = el('div', 'coach-msg', '');
    restartWrap.innerHTML = '<div style="text-align:center;padding:4px 0;">'
      + '<button onclick="startOverSession(\'Try a different scenario? Your current session will be cleared.\')" '
      + 'style="font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px;">'
      + '\u21ba Try a different scenario</button></div>';
    $('messages').appendChild(restartWrap);
  }

  // Gift tip encourager banner — collapses on first tap
  if (!state.paid) {
    const banner = el('div', 'coach-msg', '');
    banner.id = 'tip-gift-banner';
    banner.innerHTML = `
      <div class="pro-tip-card pro-tip-locked">
        <div class="pro-tip-locked-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8960c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg></div>
        <div class="pro-tip-locked-text"><b>Pick an opening above</b> to unlock your first coach tip</div>
      </div>
    `;
    $('messages').appendChild(banner);
  }

  scrollChatToBottom();

  // Log that user saw the interactive chips
  logSession('chips_seen', { chip_type: 'openings', count: openings.length });

  // Allow typing a custom opening
  enableInput('Tap an opening or type your own\u2026');
  awaitFreeText(async (text) => {
    if (!text || text.trim().length < 4) return;
    // Remove gift banner
    const gb = document.getElementById('tip-gift-banner'); if (gb) gb.remove();
    clearChips();
    disableInput('');
    simConversation.push({ role: 'user', text });
    SIM_STATE.user_opening = text;
    logSession('sim_opening_typed', { opening: text });
    appendUserBubble('I\u2019d open with:\n\u201c' + text + '\u201d');
    await loadManagerResponseToOpening(text);
  });
}

async function pickOpening(opener, pill, container) {
  // If paywall already shown, nudge user to the CTA
  if (state.paywall_shown && !state.paid) {
    return;
  }

  // Show mode banner on first tap (not before)
  if (!document.querySelector('.mode-banner')) {
    insertModeBanner('sim');
  }

  // Remove gift tip banner on first tap
  const giftBanner = document.getElementById('tip-gift-banner');
  if (giftBanner) { giftBanner.style.transition = 'opacity 0.2s, max-height 0.3s'; giftBanner.style.opacity = '0'; giftBanner.style.maxHeight = '0'; giftBanner.style.overflow = 'hidden'; setTimeout(() => giftBanner.remove(), 300); }

  // Disable all pills
  container.querySelectorAll('.sim-reply-pill').forEach(p => {
    p.classList.toggle('active', p === pill);
    p.disabled = true;
    p.style.cursor = 'default';
  });

  // Pro tip moves to coaching mode (no longer in practice flow)
  incrementScenariosUnlocked();

  const userBubble = appendUserBubble('I\u2019d open with:\n\u201c' + opener.text + '\u201d\n\n\u2014 ' + opener.theme);
  scrollChatToBottom();
  disableInput('');

  simConversation.push({ role: 'user', text: opener.text });
  SIM_STATE.user_opening = opener.text;
  SIM_STATE.branch_history.push({ scenario: 'opening', reply: opener.theme });
  logSession('sim_opening_picked', { theme: opener.theme });

  // Generate coaching insight in background (preview card shown after framing text)
  generateCoachingInsight('opening_picked', {
    opening: opener.text,
    theme: opener.theme,
    blocker: SIM_STATE.blocker,
  });

  // Add pro tip to coaching mode
  addCoachingProTip(0);

  // Coach preview card appears after user bubble — covers loading time
  showCoachPreviewCard('opening_picked', { theme: opener.theme });

  const turnNodes = [userBubble];
  simTurnElements.push(turnNodes);

  await loadManagerResponseToOpening(opener.text, turnNodes);
}

// After the user picks an opening, generate manager responses to it
async function loadManagerResponseToOpening(openingText, turnNodes) {
  await sleep(400);

  // Show the framing text BEFORE the API call — sets expectation during wait
  await typeCoachBubble("**Now pick what the recruiter might say to that.**");
  await sleep(200);
  showCoachTyping();

  try {
    const res = await fetchWithTimeout('/api/raise-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'simulate_scenarios',
        product: 'offer',
        blocker: SIM_STATE.blocker,
        context: { ...SIM_STATE.context, user_opening: openingText },
        session_id: profileHash(),
      }),
    }, 15000);
    const data = await res.json();
    hideCoachTyping();

    if (data && data.scenarios && data.scenarios.length >= 2) {
      renderScenarioLabels(data.scenarios);
    } else {
      renderScenarioLabels(getDefaultScenarios(SIM_STATE.blocker.code));
    }
  } catch (err) {
    hideCoachTyping();
    renderScenarioLabels(getDefaultScenarios(SIM_STATE.blocker.code));
  }
}

// in #messages AFTER this node = current branch content. Cleared when

let simBranchAnchor = null;

function clearBranchContent() {
  if (!simBranchAnchor) return;
  // Remove every sibling after the anchor
  while (simBranchAnchor.nextSibling) {
    simBranchAnchor.nextSibling.remove();
  }
  // Reset multi-turn state but NOT tap count — tap count is global
  // across all branches to prevent unlimited free exploration.
  simConversation = [];
  simTurnElements = [];

function renderScenarioLabels(scenarios) {
  SIM_STATE.scenarios_total = scenarios.length;
  updateTreeBadge();

  const wrap = el('div', 'coach-msg', '');
  const inner = el('div', '', '');
  const row = el('div', 'sim-pills-row', '');
  inner.appendChild(row);

  // Handler shared by the "+ Something else…" pill AND the input box.
  // Both paths feed user-supplied theme text into the same custom-scenario
  // generation flow, so typing into the input is exactly equivalent to
  // tapping the custom pill.
  const submitCustomScenario = async (text) => {
    if (!text || text.trim().length < 2) return;
    appendUserBubble(text);
    disableInput('Generating scenario\u2026');
    showCoachTyping();
    try {
      const res = await fetch('/api/raise-coach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'simulate_custom_scenario', product: 'offer',
          theme: text,
          blocker: SIM_STATE.blocker,
          context: SIM_STATE.context,
          session_id: profileHash(),
        }),
      });
      const data = await res.json();
      hideCoachTyping();
      if (data.scenario) {
        const newScenario = data.scenario;
        const newPill = el('button', 'sim-pill', '');
        newPill.textContent = newScenario.type;
        row.insertBefore(newPill, custom);
        newPill.onclick = () => expandScenario(newScenario, scenarios.length, newPill, row, wrap, scenarios);
        expandScenario(newScenario, scenarios.length, newPill, row, wrap, [...scenarios, newScenario]);
        scenarios.push(newScenario);
      }
    } catch (err) {
      hideCoachTyping();
      insertCoachBubble("I couldn't generate that scenario. Try tapping one of the options above.");
      // Re-arm so the user can try again
      enableInput('Tap a scenario or type your own\u2026');
      awaitFreeText(submitCustomScenario);
    }
  };

  const SCENARIO_INITIAL_SHOW = 3;
  const hiddenScenarioPills = [];

  // Ensure first 3 visible scenarios have one of each difficulty (easy/tough/curveball)
  const diffOrder = ['easy', 'tough', 'curveball'];
  const sorted = [];
  const remaining = [...scenarios];
  for (const d of diffOrder) {
    const idx = remaining.findIndex(s => s.difficulty === d);
    if (idx >= 0) { sorted.push(remaining.splice(idx, 1)[0]); }
  }
  // Fill remaining spots if we didn't find all 3 difficulties
  const reordered = [...sorted, ...remaining];

  reordered.forEach((s, i) => {
    const pill = el('button', 'sim-pill', '');
    pill.style.flexDirection = 'row';
    pill.style.alignItems = 'center';
    pill.style.gap = '8px';

    const content = el('div', '', '');
    content.style.flex = '1';
    content.style.minWidth = '0';

    const themeSpan = el('span', 'sim-pill-theme', '');
    themeSpan.textContent = s.type.replace(/^["'\u201c]+|["'\u201c\u201d]+$/g, '');
    content.appendChild(themeSpan);
    if (s.text) {
      const preview = el('span', 'sim-pill-preview', '');
      const clean = s.text.replace(/^["'\u201c]+|["'\u201c\u201d]+$/g, '');
      preview.textContent = clean.length > 38 ? clean.slice(0, 35) + '...' : clean;
      content.appendChild(preview);
    }
    // Radio circle
    const radio = el('div', 'chip-radio', '');
    pill.insertBefore(radio, pill.firstChild);

    pill.appendChild(content);
    // Difficulty badge for manager scenarios
    if (s.difficulty) {
      const badge = el('span', 'diff-badge ' + s.difficulty, '');
      badge.textContent = s.difficulty === 'curveball' ? '⚡ Curveball' : s.difficulty === 'tough' ? 'Tough' : 'Easy';
      pill.appendChild(badge);
    }
    pill.dataset.index = i;
    pill.onclick = () => expandScenario(s, i, pill, row, wrap, scenarios);

    if (i < SCENARIO_INITIAL_SHOW) {
      row.appendChild(pill);
    } else {
      pill.style.display = 'none';
      row.appendChild(pill);
      hiddenScenarioPills.push(pill);
    }
  });

  // "Something else" pill — hidden inside more options
  const custom = el('button', 'sim-pill sim-pill-custom', '');
  custom.textContent = "+ Something else\u2026";
  custom.style.display = 'none';
  custom.onclick = () => {
    const inputEl = $('chat-input');
    if (inputEl) inputEl.focus();
  };
  row.appendChild(custom);
  hiddenScenarioPills.push(custom);

  // Expand/collapse toggle
  if (hiddenScenarioPills.length > 0) {
    const toggle = el('button', 'chips-expand', '');
    toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg> ' + hiddenScenarioPills.length + ' more options';
    let expanded = false;
    toggle.onclick = () => {
      expanded = !expanded;
      hiddenScenarioPills.forEach(p => { p.style.display = expanded ? '' : 'none'; });
      if (expanded) {
        toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg> Show less';
      } else {
        toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg> ' + hiddenScenarioPills.length + ' more options';
      }
    };
    row.appendChild(toggle);
  }

  wrap.appendChild(inner);
  $('messages').appendChild(wrap);
  simBranchAnchor = wrap; // anchor: everything after this = branch content
  scrollChatToBottom();

  // Keep the input ACTIVE here. Earlier the input was disabled with
  // "Tap a scenario above…" which was confusing because there's also a
  // free-text option. Now: input is active, hint mentions both paths,
  // text submission feeds the custom-scenario flow.
  enableInput('Tap a scenario above or type your own\u2026');
  awaitFreeText(submitCustomScenario);

  logSession('sim_scenarios_shown', { count: scenarios.length, blocker: SIM_STATE.blocker.code });
}


// ── Tap a scenario → manager bubble + reply pills as flat messages ──
// Earlier this flow was nested: tapping a scenario chip expanded a card
// underneath the chips containing the manager line + reply chips. That
// hid the reply chips inside a sub-thread and made it unclear that
// picking a different reply branches the conversation. Now each step is
// a separate coach message in the main flow:

// Track conversation history for multi-turn simulation
let simConversation = [];

// User picked a reply pill: show their reply, then continue the
// conversation with the manager's follow-up responses.
function pickReply(reply, pill, container, scenario) {
  // If paywall already shown, nudge user to the CTA
  if (state.paywall_shown && !state.paid) {
    return;
  }

  container.querySelectorAll('.sim-reply-pill').forEach(p => {
    p.classList.toggle('active', p === pill);
    p.disabled = true;
    p.style.cursor = 'default';
  });

  logSession('sim_reply_tapped', { theme: reply.theme, scenario: scenario.type });
  SIM_STATE.branch_history.push({ scenario: scenario.type, reply: reply.theme });
  simConversation.push({ role: 'user', text: reply.text });
  incrementScenariosUnlocked();

  // Generate coaching insight in background (preview shown during loading)
  generateCoachingInsight('reply_chosen', {
    reply: reply.text,
    reply_theme: reply.theme,
    scenario_type: scenario.type,
    blocker: SIM_STATE.blocker,
    conversation: simConversation,
  });

  // Add pro tip #3 to coaching mode
  addCoachingProTip(2);

  {
    const userBubble = appendUserBubble('I\u2019d respond:\n\u201c' + reply.text + '\u201d');
    scrollChatToBottom();
    showCoachPreviewCard('reply_chosen', { reply_theme: reply.theme, scenario_type: scenario.type });
    const turnNodes = [userBubble];
    simTurnElements.push(turnNodes);
    setTimeout(() => continueConversation(scenario, turnNodes), 400);
  }
}

// User tapped a follow-up manager response chip — show the full text,
// then generate reply options for the user.
async function expandFollowupScenario(scenario, pill, pillContainer, parentScenario, followupWrap, turnNodes) {
  // Clear any previous expansion below the followup chips
  while (followupWrap.nextSibling) {
    const node = followupWrap.nextSibling;
    node.remove();
  }
  // Also pop the last assumption turn if one exists (user picked a
  // different follow-up chip, so the old assumption turn is stale)
  if (simTurnElements.length > 0) {
    const lastTurn = simTurnElements[simTurnElements.length - 1];
    if (lastTurn._isAssumptionTurn) {
      simTurnElements.pop();
      // Pop the manager entry from conversation history
      if (simConversation.length > 0 && simConversation[simConversation.length - 1].role === 'manager') {
        simConversation.pop();
      }
    }
  }

  pillContainer.querySelectorAll('.sim-pill').forEach(p => {
    p.classList.toggle('active', p === pill);
  });

  // Count this as an unlocked scenario
  if (!SIM_STATE.scenarios_explored.includes(scenario.type)) {
    SIM_STATE.scenarios_explored.push(scenario.type);
    updateTreeBadge();
  }

  simConversation.push({ role: 'manager', text: scenario.text });

  // Create a NEW turn entry for this assumption pick — separate from the
  // reply turn, so goBack can undo just the assumption without undoing
  // the user's reply that led to the follow-up chips.
  const assumptionTurnNodes = [];
  assumptionTurnNodes._isAssumptionTurn = true;
  simTurnElements.push(assumptionTurnNodes);

  const userBubble = appendUserBubble('My manager\u2019s response:\n' + scenario.type.replace(/^["'\u201c\u201d]+|["'\u201c\u201d]+$/g, ''));
  assumptionTurnNodes.push(userBubble);

  const mgrBubble = renderManagerBubble(scenario);
  assumptionTurnNodes.push(mgrBubble);
  await sleep(300);


  showCoachTyping();
  let replies;
  try {
    const res = await fetch('/api/raise-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'simulate_replies', product: 'offer',
        manager_said: scenario.text,
        scenario_type: scenario.type,
        blocker: SIM_STATE.blocker,
        context: SIM_STATE.context,
        session_id: profileHash(),
      }),
    });
    const data = await res.json();
    replies = (data.replies && data.replies.length >= 2) ? data.replies : getDefaultReplies();
  } catch (err) {
    replies = getDefaultReplies();
  }
  hideCoachTyping();

  const assumptionBack = renderBackButton('assumption');
  assumptionTurnNodes.push(assumptionBack);

  renderReplyPillsFlat(replies, parentScenario);
  const lastMsg = $('messages').lastElementChild;
  if (lastMsg) assumptionTurnNodes.push(lastMsg);

}

// Back button — two variants:
// 'response' (default): "← Try a different response" — after reply nodes
// 'assumption': "← Try a different assumption" — after manager option nodes
function renderBackButton(variant) {
  const wrap = el('div', 'sim-back-wrap', '');
  const btn = el('button', 'sim-back-btn', '');
  btn.innerHTML = variant === 'assumption'
    ? '\u2190 Try a different assumption'
    : '\u2190 Try a different response';
  btn.onclick = () => goBack();
  wrap.appendChild(btn);
  $('messages').appendChild(wrap);
  scrollChatToBottom();
  return wrap;
}

// Remove the last turn's DOM elements, pop conversation history,
// and re-enable the previous reply pills.
function goBack() {
  if (simTurnElements.length === 0) return;

  const lastTurn = simTurnElements.pop();
  lastTurn.forEach(node => { if (node && node.parentNode) node.remove(); });

  if (lastTurn._isAssumptionTurn) {
    // Assumption turn: only the manager's follow-up was added to conversation
    if (simConversation.length > 0 && simConversation[simConversation.length - 1].role === 'manager') {
      simConversation.pop();
    }
  } else {
    // Reply turn: pop both user reply and any manager follow-up
    if (simConversation.length > 0 && simConversation[simConversation.length - 1].role === 'manager') {
      simConversation.pop();
    }
    if (simConversation.length > 0 && simConversation[simConversation.length - 1].role === 'user') {
      simConversation.pop();
    }
    if (SIM_STATE.branch_history.length > 0) {
      SIM_STATE.branch_history.pop();
    }
  }

  updateTreeBadge();

  // Re-enable all pills so the user can pick again
  $('messages').querySelectorAll('.sim-pill, .sim-reply-pill').forEach(p => {
    p.disabled = false;
    p.style.cursor = '';
    p.classList.remove('active');
  });

  enableInput('Tap an option or type your own\u2026');

  // Scroll to the last visible interactive element so the user sees
  // the pills they can now re-tap (not an empty bottom of the chat)
  const lastPill = $('messages').querySelector('.sim-reply-pill:last-of-type, .sim-pill:last-of-type');
  if (lastPill) {
    lastPill.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else {
    scrollChatToBottom();
  }

}

          Object.keys(data.insights).forEach(function(dim) {
            if (discCanvasBlocks[dim] !== undefined) {
              discCanvasBlocks[dim].insight = data.insights[dim];
              if (stratPlanKeys.indexOf(dim) >= 0) {
                discCanvasBlocks[dim].filled = true;
                discCanvasBlocks[dim].strength = 'plan';
                discCanvasBlocks[dim].teaser = false; // full content — remove teaser flag
              }
            }
          });
          try {
            state.discovery = state.discovery || {};
            state.discovery.canvasBlocks = discCanvasBlocks;
            saveState();
          } catch(e) {}
        }
      }).catch(function() { /* non-fatal */ });
      }); // end forEach
    } // end block scope

    const res = await fetch(API_CHECKOUT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        profile_hash: profileHash(),
        profile: checkoutProfile,
        final_range: checkoutRange,
        obstacle: checkoutObstacle,
        refSource,
        promo_code: undefined,
        price: checkoutPrice,
        product: 'offer',
        offer_context: ctx,
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.url) throw new Error('No checkout URL');
    window.location.href = data.url;
  } catch (err) {
    document.querySelectorAll('.btn-pay').forEach(el => {
      if (el.dataset.origHtml) {
        el.innerHTML = el.dataset.origHtml;
        delete el.dataset.origHtml;
      } else {
        el.querySelectorAll('.rl-cta-spinner').forEach(s => s.remove());
      }
      el.style.pointerEvents = '';
      el.removeAttribute('disabled');
    });
    showErrorBubble("Couldn't open checkout. Check your connection and try again, or email support@recomlinked.com.", null);
  }
}

async function renderPaywallBubble(opts) {

/* ───────────────────────────────────────────────────────── */


/* ── Free-text input wiring ────────────────────────────── */
let pendingSubmitHandler = null;

function awaitFreeText(onSubmit) {
  pendingSubmitHandler = onSubmit;
}


function handleSend() {
  const input = $('chat-input');
  const val = (input.value || '').trim();
  if (!val) return;

  // If in coaching mode, handle as coaching free text
  if (!SIM_STATE.simMode) {
    input.value = '';
    handleCoachingChat(val);
    return;
  }

  // Practice mode — existing chip/free-text handler
  if (!pendingSubmitHandler) return;
  input.value = '';
  const h = pendingSubmitHandler;
  pendingSubmitHandler = null;
  h(val);
}

// Coaching mode free text chat
let coachingChatHistory = [];

async function handleCoachingChat(userText) {
  const coachingEl = $('coaching-messages');
  if (!coachingEl) return;

  // Remove "Back to practice" CTA while responding
  coachingEl.querySelectorAll('.back-to-practice').forEach(e => e.remove());

  // Show user message in coaching
  const userWrap = el('div', 'user-msg', '');
  userWrap.innerHTML = `<div class="user-bubble">${escapeHtml(userText)}</div>`;
  coachingEl.appendChild(userWrap);
  scrollCoachingToBottom();

  coachingChatHistory.push({ role: 'user', content: userText });

  // Show typing indicator (consistent with practice mode)
  const typingWrap = el('div', 'coach-msg coaching-typing', '');
  typingWrap.innerHTML = `
    <div class="bubble typing-bubble">
      <div class="typing-indicator">
        <svg class="rl-typing-arc" width="28" height="28" viewBox="0 0 32 32">
          <circle class="rl-arc-track" cx="16" cy="16" r="11" fill="none" stroke="#c9a84c" stroke-opacity="0.12" stroke-width="2.5" stroke-linecap="round" transform="rotate(-210 16 16)"/>
          <circle class="rl-arc-fill"  cx="16" cy="16" r="11" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="35" transform="rotate(-210 16 16)"/>
        </svg>
        <span class="typing-phrase">Your coach is thinking\u2026</span>
      </div>
    </div>
  `;
  $('coaching-messages').appendChild(typingWrap);
  scrollCoachingToBottom();
  startTypingArcAnimation(typingWrap);

  try {
    const res = await fetchWithTimeout('/api/raise-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'coaching_chat', product: 'offer',
        message: userText,
        chat_history: coachingChatHistory.slice(-10),
        practice_context: {
          blocker: SIM_STATE.blocker,
          user_opening: SIM_STATE.user_opening,
          scenarios_explored: SIM_STATE.scenarios_explored,
          branch_history: SIM_STATE.branch_history,
          conversation: simConversation,
        },
        session_id: profileHash(),
      }),
    }, 30000);
    const data = await res.json();

    // Remove typing indicator
    if (typingWrap._arcStop) typingWrap._arcStop();
    typingWrap.remove();

    const reply = data.reply || data.insight || "I'm here to help with your raise conversation. Ask me anything about your situation.";
    coachingChatHistory.push({ role: 'assistant', content: reply });

    // Show coach reply with typing animation
    const replyWrap = el('div', 'coach-msg', '');
    const replyBubble = el('div', 'bubble', '');
    replyBubble.innerHTML = '<p><span class="typed-text"></span><span class="cursor"></span></p>';
    replyWrap.appendChild(replyBubble);
    coachingEl.appendChild(replyWrap);
    scrollCoachingToBottom();

    const typedSpan = replyBubble.querySelector('.typed-text');
    const cursorEl2 = replyBubble.querySelector('.cursor');
    await typeIntoElement(typedSpan, reply);
    if (cursorEl2) cursorEl2.remove();
    // Apply bold formatting after typing completes
    typedSpan.innerHTML = inlineBold(escapeHtml(reply));
  } catch (err) {
    if (typingWrap._arcStop) typingWrap._arcStop();
    typingWrap.remove();
    const errWrap = el('div', 'coach-msg', '');
    errWrap.innerHTML = '<div class="bubble"><p>Sorry, I couldn\'t process that. Try again.</p></div>';
    coachingEl.appendChild(errWrap);
  }

  // Re-add "Back to practice" CTA
  addBackToPracticeCTA();
  scrollCoachingToBottom();
}


$('send-btn').addEventListener('click', handleSend);
$('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

init().catch(err => {
  console.error('init failed:', err);
  stopThinkingAnimation();
  showErrorBubble("Something went wrong loading your session. Refresh to try again.", null);
});
